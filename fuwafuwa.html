<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pengin ふわふわ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #76766f; color: #33352f; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 14px 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  header .ttl { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 19px; letter-spacing: .04em; color: #f4f4ee; }
  header .badge { font-size: 11px; background: #e7e2d2; border-radius: 999px; padding: 2px 9px; color: #6d6a5c; }
  header .sp { flex: 1; }
  header button, #detail button, #sheet button {
    font: inherit; font-size: 15px; font-weight: 600; min-height: 46px;
    border: 1px solid rgba(255,255,255,.65); color: #3c3e36;
    background: linear-gradient(160deg, rgba(255,255,255,.97), rgba(230,230,224,.94));
    border-radius: 999px; padding: 11px 22px; cursor: pointer;
    box-shadow: 0 5px 16px rgba(28,30,26,.28), inset 0 1.5px 0 rgba(255,255,255,.9);
  }
  header button:active, #detail button:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(28,30,26,.25); }
  #detail button {
    background: linear-gradient(160deg, #f2f9e6, #cde5ae);
    border-color: rgba(198,228,165,.85); color: #33512a;
  }
  #crumbs { padding: 2px 14px 10px; font-size: 14px; color: #efdcb2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #crumbs button {
    font: inherit; font-size: 14px; font-weight: 700; color: #6b4420; cursor: pointer;
    min-height: 40px; padding: 8px 17px; border-radius: 999px;
    border: 1px solid rgba(255,244,214,.85);
    background: linear-gradient(165deg, #f9e9c4 0%, #f0cd93 52%, #e3ac6c 100%);
    box-shadow: 0 4px 11px rgba(40,30,10,.32), inset 0 2px 3px rgba(255,255,255,.75), inset 0 -4px 6px rgba(165,102,40,.35);
  }
  #crumbs button:active { transform: translateY(1px); }
  #crumbs span { color: #efdcb2; font-size: 15px; }
  #status { padding: 0 14px 6px; font-size: 12px; color: #dcdcd2; min-height: 16px; }
  #stage { position: relative; flex: 1; overflow: hidden; touch-action: none;
    background:
      radial-gradient(ellipse 70% 50% at 25% 20%, #8e8e87 0%, rgba(142,142,135,0) 60%),
      radial-gradient(ellipse 60% 45% at 80% 85%, #82857a 0%, rgba(130,133,122,0) 65%),
      #76766f; }
  #world { position: absolute; left: 0; top: 0; width: 1700px; height: 1250px; transform-origin: 0 0; }
  #seams { position: absolute; left: 0; top: 0; width: 1700px; height: 1250px; pointer-events: none; }
  #guides { position: absolute; left: 0; top: 0; width: 1700px; height: 1250px; pointer-events: none; }
  #guides circle { fill: none; stroke: rgba(255,255,255,.30); stroke-width: 2; stroke-dasharray: 3 11; stroke-linecap: round; }
  #guides circle.gdot { fill: rgba(255,255,255,.35); stroke: none; }
  .node { position: absolute; transform: translate(-50%, -50%); cursor: grab; touch-action: none; z-index: 2; }
  .node.dragging { cursor: grabbing; z-index: 5; }
  .node .card {
    width: 100%; height: 100%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 13px; font-size: 14px; line-height: 1.35; word-break: break-all;
    border: 1.5px solid rgba(255,255,255,.85);
    background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.13), rgba(170,215,255,.13), rgba(215,255,190,.13), rgba(255,240,180,.10), rgba(255,170,215,.13)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.55) 34%, rgba(214,232,255,.30) 62%, rgba(255,214,238,.32) 84%, rgba(190,220,255,.38) 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), inset 0 0 18px rgba(255,255,255,.35), inset -6px -8px 16px rgba(160,190,255,.28), 0 12px 26px rgba(28,30,26,.38);
    animation: fuwa ease-in-out infinite alternate; user-select: none; -webkit-user-select: none;
  }
  .node.folder .card {
    background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.10), rgba(170,215,255,.10), rgba(215,255,190,.12), rgba(255,240,180,.08), rgba(255,170,215,.10)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.96) 0%, rgba(228,247,207,.68) 38%, rgba(178,224,145,.48) 72%, rgba(148,203,118,.55) 100%);
    color: #33512a; font-weight: 600;
  }
  .node.c-midori .card { background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.10), rgba(170,215,255,.10), rgba(215,255,190,.12), rgba(255,240,180,.08), rgba(255,170,215,.10)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(226,246,205,.66) 38%, rgba(171,220,140,.50) 72%, rgba(140,198,110,.58) 100%); color: #33512a; }
  .node.c-sora .card { background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.10), rgba(170,215,255,.12), rgba(215,255,190,.10), rgba(255,240,180,.08), rgba(255,170,215,.10)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(210,238,252,.66) 38%, rgba(140,200,240,.50) 72%, rgba(105,175,225,.58) 100%); color: #274b63; }
  .node.c-momo .card { background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.12), rgba(170,215,255,.10), rgba(215,255,190,.10), rgba(255,240,180,.08), rgba(255,170,215,.12)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(253,224,235,.68) 38%, rgba(246,170,200,.50) 72%, rgba(238,140,180,.56) 100%); color: #6d2f47; }
  .node.c-himawari .card { background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.10), rgba(170,215,255,.10), rgba(215,255,190,.10), rgba(255,240,180,.12), rgba(255,170,215,.10)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(253,243,205,.68) 38%, rgba(248,214,120,.52) 72%, rgba(240,190,80,.58) 100%); color: #664d15; }
  .node.c-budou .card { background:
      radial-gradient(ellipse 46% 26% at 34% 18%, rgba(255,255,255,.97), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 30% 16% at 72% 84%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      conic-gradient(from 210deg at 50% 50%, rgba(255,170,215,.12), rgba(170,215,255,.10), rgba(215,255,190,.10), rgba(255,240,180,.08), rgba(255,170,215,.12)),
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(238,226,252,.68) 38%, rgba(198,160,240,.50) 72%, rgba(170,125,228,.58) 100%); color: #472a66; }
  header button.on { background: linear-gradient(160deg, #f2f9e6, #cde5ae); border-color: rgba(198,228,165,.9); color: #33512a; }
  #fishBar { display: none; padding: 0 14px 8px; align-items: center; gap: 10px; color: #f0f0e6; font-size: 13px; }
  #fishBar.open { display: flex; }
  #fishBar input[type="range"] { flex: 1; accent-color: #b9dc92; height: 30px; }
  .linklabel { font-size: 25px; font-weight: 600; fill: #f6f8e8; paint-order: stroke; stroke: rgba(43,45,38,.6); stroke-width: 5px; }
  #linkSheet { position: fixed; inset: 0; background: rgba(50,52,44,.45); display: none; z-index: 30; }
  #linkSheet.open { display: block; }
  #linkSheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow: auto; background: #f6f6f2;
    border-radius: 20px 20px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); }
  #linkSheet h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 19px; margin: 0 0 12px; }
  #linkSheet .close { float: right; font: inherit; font-size: 14px; font-weight: 600; min-height: 42px; padding: 8px 18px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.65); cursor: pointer;
    background: linear-gradient(160deg, rgba(255,255,255,.97), rgba(230,230,224,.94)); box-shadow: 0 4px 12px rgba(28,30,26,.22); }
  #linkSheet .lsrow { margin: 14px 0; }
  #linkSheet .lsrow .who { font-weight: 600; font-size: 15px; margin-bottom: 5px; color: #3c3e36; }
  #linkSheet .lsrow input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; color: #33352f;
    border: 1px solid #c9c9c0; border-radius: 14px; background: #fff; }
  #linkSheet .lsrow textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; color: #33352f;
    border: 1px solid #c9c9c0; border-radius: 14px; background: #fff; min-height: 84px; line-height: 1.6; resize: vertical; margin-top: 6px; }
  #linkSheet .lscut { margin-top: 6px; font: inherit; font-size: 13.5px; font-weight: 600; min-height: 38px; padding: 6px 16px;
    cursor: pointer; border-radius: 999px; border: 1px solid #d9a49c; color: #8c3a30; background: linear-gradient(160deg, #fdf0ec, #f3d3cb); }
  #linkSheet #lsSave { width: 100%; font: inherit; font-size: 16px; font-weight: 700; min-height: 52px; margin-top: 8px; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(160,200,120,.8); color: #2e4a24;
    background: linear-gradient(160deg, #eef7dd, #b9dc92); box-shadow: 0 5px 16px rgba(60,90,40,.25); }
  body.day { background: #93a884; }
  body.day #stage { background:
      radial-gradient(ellipse 65% 45% at 22% 12%, rgba(240,250,220,.55) 0%, rgba(240,250,220,0) 60%),
      radial-gradient(ellipse 55% 40% at 85% 90%, rgba(110,150,95,.5) 0%, rgba(110,150,95,0) 65%),
      linear-gradient(#a9bf97, #87a374); }
  body.day #status { color: #37452f; }
  body.night { background: #252b3d; }
  body.night #stage { background:
      radial-gradient(ellipse 50% 36% at 78% 10%, rgba(240,240,205,.22) 0%, rgba(240,240,205,0) 60%),
      radial-gradient(rgba(255,255,255,.85) 1px, transparent 1.5px),
      radial-gradient(rgba(255,255,255,.45) 1px, transparent 1.5px),
      linear-gradient(#222839, #2e3a52 55%, #3a4666);
    background-size: auto, 130px 130px, 210px 210px, auto;
    background-position: 0 0, 0 0, 60px 80px, 0 0; }
  #editor .colorrow { display: flex; gap: 8px; flex-wrap: wrap; }
  #editor .cchip { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,.9);
    box-shadow: inset 0 0 8px rgba(255,255,255,.5), 0 3px 8px rgba(28,30,26,.25); padding: 0; }
  #editor .cchip.on { outline: 3px solid #7fae56; outline-offset: 1px; }
  #editor .cchip.auto { background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.98), rgba(214,232,255,.35) 65%, rgba(255,214,238,.4)); }
  #editor .cchip.midori { background: radial-gradient(circle at 32% 26%, #f4fbe9, #a9d68a 70%, #8cc66e); }
  #editor .cchip.sora { background: radial-gradient(circle at 32% 26%, #eef8fe, #8cc8f0 70%, #69afe1); }
  #editor .cchip.momo { background: radial-gradient(circle at 32% 26%, #fef0f5, #f6aac8 70%, #ee8cb4); }
  #editor .cchip.himawari { background: radial-gradient(circle at 32% 26%, #fef9e3, #f8d678 70%, #f0be50); }
  #editor .cchip.budou { background: radial-gradient(circle at 32% 26%, #f7effe, #c6a0f0 70%, #aa7de4); }
  .node.page .card { color: #43453e; }
  .node.selected .card { outline: 3px solid #fff; box-shadow: 0 0 0 6px rgba(190,235,160,.5), 0 14px 30px rgba(28,30,26,.4); }
  .node.snapcand .card { box-shadow: 0 0 0 6px rgba(255,255,255,.75), 0 14px 30px rgba(90,95,70,.25); }
  @keyframes fuwa { from { transform: translateY(-5px) rotate(-1.1deg); } to { transform: translateY(6px) rotate(1.1deg); } }
  .node.dragging .card, .node.selected .card { animation-play-state: paused; }
  #detail { min-height: 54px; padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px;
    background: rgba(238,238,234,.94); border-top: 1px solid #b9b9b2; backdrop-filter: blur(6px); }
  #detail .dt { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail .dk { font-size: 11px; color: #8b887a; margin-right: 6px; }
  #sheet { position: fixed; inset: 0; background: rgba(50,52,44,.45); display: none; z-index: 20; }
  #sheet.open { display: block; }
  #sheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78dvh; overflow: auto; background: #fffdf6;
    border-radius: 20px 20px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); }
  #sheet h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 19px; margin: 0 0 10px; }
  #sheet .body { white-space: pre-wrap; font-size: 14.5px; line-height: 1.75; color: #3c3e36; }
  #sheet .close { position: sticky; top: 0; float: right; }
  #lock { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #83837b, #76766f 60%, #6b6b64); }
  #lock.hide { display: none; }
  #lock .lockbox { text-align: center; padding: 24px; width: min(320px, 86vw); }
  #lock .lockmark { font-size: 44px; }
  #lock .locktitle { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 26px; color: #f4f4ee; letter-spacing: .1em; margin-top: 2px; }
  #lock .lockmsg { color: #e8e8de; font-size: 13.5px; min-height: 20px; margin: 10px 0 12px; }
  #lock input { width: 190px; text-align: center; font-size: 26px; letter-spacing: .45em; padding: 12px 6px 12px 18px;
    border-radius: 16px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.94); color: #33352f; }
  #lock button { display: block; margin: 18px auto 0; font: inherit; font-size: 16px; font-weight: 700; min-height: 50px;
    padding: 0 38px; cursor: pointer; border-radius: 999px; border: 1px solid rgba(160,200,120,.8); color: #2e4a24;
    background: linear-gradient(160deg, #eef7dd, #b9dc92); box-shadow: 0 5px 16px rgba(30,40,20,.3); }
  #lock.shake .lockbox { animation: lockshake .4s; }
  @keyframes lockshake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  #editor { position: fixed; inset: 0; background: rgba(50,52,44,.45); display: none; z-index: 30; }
  #editor.open { display: block; }
  #editor .box { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow: auto; background: #f6f6f2;
    border-radius: 20px 20px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); }
  #editor h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 19px; margin: 0 0 12px; }
  #editor .close { float: right; font: inherit; font-size: 14px; font-weight: 600; min-height: 42px; padding: 8px 18px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.65); cursor: pointer;
    background: linear-gradient(160deg, rgba(255,255,255,.97), rgba(230,230,224,.94)); box-shadow: 0 4px 12px rgba(28,30,26,.22); }
  #editor label { display: block; font-size: 12.5px; color: #7c7c72; margin: 12px 0 5px; }
  #editor input[type="text"], #editor textarea {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; color: #33352f;
    border: 1px solid #c9c9c0; border-radius: 14px; background: #fff; }
  #editor textarea { min-height: 150px; line-height: 1.7; resize: vertical; }
  #editor .kindrow { display: flex; gap: 10px; }
  #editor .kind { flex: 1; font: inherit; font-size: 15px; font-weight: 600; min-height: 46px; padding: 10px; cursor: pointer;
    border-radius: 999px; border: 1px solid #c9c9c0; background: #fff; color: #6a6c62; }
  #editor .kind.on { background: linear-gradient(160deg, #f2f9e6, #cde5ae); border-color: rgba(160,200,120,.8); color: #33512a; }
  #editor .edrow { display: flex; gap: 10px; margin-top: 18px; }
  #editor #edSave { flex: 1; font: inherit; font-size: 16px; font-weight: 700; min-height: 52px; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(160,200,120,.8); color: #2e4a24;
    background: linear-gradient(160deg, #eef7dd, #b9dc92); box-shadow: 0 5px 16px rgba(60,90,40,.25); }
  #editor #edDelete { font: inherit; font-size: 15px; font-weight: 600; min-height: 52px; padding: 0 22px; cursor: pointer;
    border-radius: 999px; border: 1px solid #d9a49c; color: #8c3a30; background: linear-gradient(160deg, #fdf0ec, #f3d3cb); }
  @media (prefers-reduced-motion: reduce) { .node .card { animation: none; } }
</style>
</head>
<body>
<div id="lock">
  <div class="lockbox">
    <div class="lockmark">🫧</div>
    <div class="locktitle">pengin</div>
    <p class="lockmsg" id="lockMsg">パスキーを入れてね</p>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">
    <button id="lockBtn" type="button">ひらく</button>
  </div>
</div>
<div id="app">
  <header>
    <span class="ttl">pengin ふわふわ</span>
    <span class="badge">ふわふわ版</span>
    <span class="sp"></span>
    <button id="btnNew" type="button">＋ 新規</button>
    <button id="btnFish" type="button">魚眼</button>
    <button id="btnReload" type="button">更新</button>
    <button id="btnFit" type="button">全体</button>
    <button id="btnReset" type="button">並びをリセット</button>
  </header>
  <div id="fishBar"><span>魚眼の強さ</span><input id="fishRange" type="range" min="0" max="100" value="50"></div>
  <div id="crumbs"></div>
  <div id="status">読み込み中…</div>
  <div id="stage">
    <div id="world">
      <svg id="guides">
        <circle cx="850" cy="625" r="180"/><circle cx="850" cy="625" r="360"/>
        <circle cx="850" cy="625" r="540"/><circle cx="850" cy="625" r="720"/>
        <circle class="gdot" cx="850" cy="625" r="6"/>
      </svg>
      <svg id="seams"><defs><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter></defs></svg>
    </div>
  </div>
  <div id="detail"><span class="dt" style="color:#9a9687">カードをタップすると、カメラが寄ります</span></div>
</div>
<div id="sheet"><div class="box"><button class="close" id="sheetClose" type="button">閉じる</button><h2 id="sheetTitle"></h2><div class="body" id="sheetBody"></div></div></div>
<div id="editor"><div class="box">
  <button class="close" id="edClose" type="button">閉じる</button>
  <h2 id="edHeading">新規作成</h2>
  <label for="edTitle">タイトル</label>
  <input id="edTitle" type="text" autocomplete="off">
  <label>種類</label>
  <div class="kindrow">
    <button type="button" id="kindPage" class="kind on">ページ</button>
    <button type="button" id="kindFolder" class="kind">フォルダ</button>
  </div>
  <label>泡の色</label>
  <div class="colorrow" id="colorRow">
    <button type="button" class="cchip auto on" data-color="auto" title="自動"></button>
    <button type="button" class="cchip midori" data-color="midori" title="みどり"></button>
    <button type="button" class="cchip sora" data-color="sora" title="そら"></button>
    <button type="button" class="cchip momo" data-color="momo" title="もも"></button>
    <button type="button" class="cchip himawari" data-color="himawari" title="ひまわり"></button>
    <button type="button" class="cchip budou" data-color="budou" title="ぶどう"></button>
  </div>
  <label for="edBody">本文</label>
  <textarea id="edBody"></textarea>
  <div class="edrow">
    <button type="button" id="edSave">保存する</button>
    <button type="button" id="edDelete" class="danger">削除</button>
  </div>
</div></div>
<div id="linkSheet"><div class="box">
  <button class="close" id="lsClose" type="button">閉じる</button>
  <h2 id="lsTitle">リンクメモ</h2>
  <div id="lsRows"></div>
  <button type="button" id="lsSave">保存する</button>
</div></div>

<script>
const SUPABASE_URL = 'https://slofvjhrlbgiqvwyxqvo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_m7cgZnABDuFA1P0HKQG_4w_KgAXHLrh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const WORLD_W = 1700, WORLD_H = 1250;
const POS_KEY = 'fuwaPosV1';

let rows = [], byId = new Map();
let currentParent = 'root';
let nodes = []; // {id,title,kind,r,x,y,el}
let view = { x: 0, y: 0, s: 0.5 };
let selectedId = null;
function normalizeSettings(p) {
  if (p && typeof p === 'object' && p.pos) return { pos: p.pos || {}, color: p.color || {}, links: p.links || [] };
  return { pos: (p && typeof p === 'object') ? p : {}, color: {}, links: [] };
}
let settings = { pos: {}, color: {}, links: [] };
try { settings = normalizeSettings(JSON.parse(localStorage.getItem(POS_KEY) || '{}')); } catch (e) {}
let layoutRowId = null, layoutTimer = null;
function scheduleSettingsSave() {
  try { localStorage.setItem(POS_KEY, JSON.stringify(settings)); } catch (e) {}
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(saveLayoutRemote, 900);
}
const KEPOS_ID = 'a757f322-17fc-494a-9d77-cbe72fc06d26';

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const seams = document.getElementById('seams');
const statusEl = document.getElementById('status');
const crumbsEl = document.getElementById('crumbs');
const detailEl = document.getElementById('detail');

function childrenOf(pid) {
  return rows.filter(r => r.id !== layoutRowId && (pid === 'root' ? r.parent_id === null : r.parent_id === pid))
             .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
}
function folderName(id) { const r = byId.get(id); return r ? r.title : ''; }

async function load() {
  const { data, error } = await sb.from('wiki_pages').select('*').order('sort_order', { ascending: true });
  if (error) { statusEl.textContent = '読み込みに失敗しました：' + error.message; return; }
  rows = data || [];
  byId = new Map(rows.map(r => [r.id, r]));
  const lr = rows.find(r => r.title === 'fuwa-layout' && r.kind === 'page');
  if (lr) {
    layoutRowId = lr.id;
    try { settings = normalizeSettings(JSON.parse(lr.content || '{}')); } catch (e) {}
  }
  statusEl.textContent = '全 ' + rows.length + ' ページ（並びは全端末で同期されます）';
  buildLevel('root');
  openView();
}

function buildLevel(pid) {
  currentParent = pid;
  selectedId = null;
  world.querySelectorAll('.node').forEach(el => el.remove());
  seams.querySelectorAll('line, path, text').forEach(el => el.remove());
  const kids = childrenOf(pid);
  const posMap = settings.pos[pid] || {};
  nodes = kids.map((r, i) => {
    const rad = r.kind === 'folder' ? 66 : 54;
    let p = posMap[r.id];
    if (!p) {
      const ang = i * 2.39996, dist = 130 * Math.sqrt(i + 0.6);
      p = { x: WORLD_W / 2 + dist * Math.cos(ang), y: WORLD_H / 2 + dist * Math.sin(ang) * 0.82 };
    }
    const el = document.createElement('div');
    el.className = 'node ' + (r.kind === 'folder' ? 'folder' : 'page') + (settings.color[r.id] ? ' c-' + settings.color[r.id] : '');
    el.dataset.id = r.id;
    el.style.width = rad * 2 + 'px'; el.style.height = rad * 2 + 'px';
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDuration = (3.4 + (i % 5) * 0.45) + 's';
    card.style.animationDelay = (-(i % 7) * 0.6) + 's';
    card.textContent = r.title;
    el.appendChild(card);
    world.appendChild(el);
    const n = { id: r.id, title: r.title, kind: r.kind, r: rad, x: p.x, y: p.y, el };
    place(n);
    return n;
  });
  renderCrumbs();
  renderDetail();
  renderSeams();
}

// ===== 魚眼 =====
let fisheyeOn = false;
let fishK = 0.55;
function fishParams() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!sw || !sh) return null;
  return {
    cx: (sw / 2 - view.x) / view.s, cy: (sh / 2 - view.y) / view.s,
    Rw: (Math.min(sw, sh) * 0.62) / view.s
  };
}
function warpPoint(x, y) {
  if (!fisheyeOn) return { x, y, k: 1 };
  const P = fishParams(); if (!P) return { x, y, k: 1 };
  const dx = x - P.cx, dy = y - P.cy, d = Math.hypot(dx, dy);
  if (d >= P.Rw || d === 0) return { x, y, k: 1 };
  const t = 1 - (d / P.Rw) * (d / P.Rw);
  return { x: P.cx + dx * (1 + fishK * 0.5 * t), y: P.cy + dy * (1 + fishK * 0.5 * t), k: 1 + fishK * t };
}
function unwarpPoint(x, y) {
  if (!fisheyeOn) return { x, y };
  const P = fishParams(); if (!P) return { x, y };
  const dx = x - P.cx, dy = y - P.cy, dp = Math.hypot(dx, dy);
  if (dp === 0) return { x, y };
  let d = dp;
  for (let i = 0; i < 3; i++) {
    const t = Math.max(0, 1 - (d / P.Rw) * (d / P.Rw));
    d = dp / (1 + fishK * 0.5 * t);
  }
  const s = d / dp;
  return { x: P.cx + dx * s, y: P.cy + dy * s };
}
function place(n) {
  const w = warpPoint(n.x, n.y);
  n.el.style.left = w.x + 'px'; n.el.style.top = w.y + 'px';
  n.el.style.transform = 'translate(-50%,-50%) scale(' + w.k.toFixed(3) + ')';
}
function layoutAll() { nodes.forEach(place); renderSeams(); }
function applyView() { world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')'; if (fisheyeOn) layoutAll(); }

function renderCrumbs() {
  crumbsEl.innerHTML = '';
  const path = [];
  let cur = currentParent;
  while (cur !== 'root') { path.unshift(cur); cur = (byId.get(cur) || {}).parent_id || 'root'; }
  const mk = (label, pid) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '🍞 ' + label;
    b.addEventListener('click', () => { buildLevel(pid); fitView(true); });
    crumbsEl.appendChild(b);
  };
  mk('トップ', 'root');
  path.forEach(id => { const s = document.createElement('span'); s.textContent = '›'; crumbsEl.appendChild(s); mk(folderName(id), id); });
}

function renderDetail() {
  detailEl.innerHTML = '';
  if (linkAsk) {
    const a = nodes.find(x => x.id === linkAsk.a), b = nodes.find(x => x.id === linkAsk.b);
    if (a && b) {
      const k = document.createElement('span'); k.className = 'dk'; k.textContent = 'リンク';
      const t = document.createElement('span'); t.className = 'dt';
      t.textContent = '「' + a.title + '」と「' + b.title + '」をリンクする？';
      detailEl.appendChild(k); detailEl.appendChild(t);
      const y = document.createElement('button'); y.type = 'button'; y.textContent = 'はい';
      y.addEventListener('click', () => { if (!isLinked(a.id, b.id)) toggleLink(a.id, b.id); linkAsk = null; renderDetail(); });
      detailEl.appendChild(y);
      const nn = document.createElement('button'); nn.type = 'button'; nn.textContent = 'やめる';
      nn.addEventListener('click', () => { linkAsk = null; renderDetail(); });
      detailEl.appendChild(nn);
      return;
    }
    linkAsk = null;
  }
  const n = nodes.find(x => x.id === selectedId);
  if (!n) {
    const s = document.createElement('span'); s.className = 'dt'; s.style.color = '#9a9687';
    s.textContent = 'カードをタップすると、カメラが寄ります';
    detailEl.appendChild(s); return;
  }
  const k = document.createElement('span'); k.className = 'dk';
  const lc = linkCount(n.id);
  k.textContent = (n.kind === 'folder' ? 'フォルダ' : 'ページ') + (lc ? ' ・ リンク' + lc + '本' : '');
  const t = document.createElement('span'); t.className = 'dt'; t.textContent = n.title;
  detailEl.appendChild(k); detailEl.appendChild(t);
  const b = document.createElement('button'); b.type = 'button';
  b.textContent = n.kind === 'folder' ? '開く ›' : '本文を見る';
  b.addEventListener('click', () => { if (n.kind === 'folder') { buildLevel(n.id); fitView(true); } else openSheet(n); });
  detailEl.appendChild(b);
  const e = document.createElement('button'); e.type = 'button';
  e.textContent = '編集';
  e.addEventListener('click', () => openEditor(n));
  detailEl.appendChild(e);
  const lb = document.createElement('button'); lb.type = 'button';
  lb.textContent = linkMode ? 'つなぎ中…' : 'つなぐ';
  lb.addEventListener('click', () => {
    linkMode = !linkMode;
    statusEl.textContent = linkMode ? 'つなぎたい泡をタップしてね（つながってたら切れます）' : '';
    renderDetail();
  });
  detailEl.appendChild(lb);
  if (pairPartner(n)) {
    const db = document.createElement('button'); db.type = 'button';
    db.textContent = '解散';
    db.addEventListener('click', () => { dissolveNode(n); renderDetail(); });
    detailEl.appendChild(db);
  }
  if (lc) {
    const mb = document.createElement('button'); mb.type = 'button';
    mb.textContent = 'リンクメモ';
    mb.addEventListener('click', () => openLinkSheet(n));
    detailEl.appendChild(mb);
  }
}

function linkCount(id) { return settings.links.filter(l => l.a === id || l.b === id).length; }
function isLinked(a, b) { return settings.links.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a)); }
function pairPartner(n) {
  for (const o of nodes) {
    if (o === n) continue;
    const d = Math.hypot(n.x - o.x, n.y - o.y);
    if (Math.abs(d - (n.r + o.r)) <= 22) return o;
  }
  return null;
}
function dissolveNode(n) {
  const partners = nodes.filter(o => o !== n && Math.abs(Math.hypot(n.x - o.x, n.y - o.y) - (n.r + o.r)) <= 22);
  if (!partners.length) return;
  linkAsk = null;
  const cx = partners.reduce((s, o) => s + o.x, 0) / partners.length;
  const cy = partners.reduce((s, o) => s + o.y, 0) / partners.length;
  let dx = n.x - cx, dy = n.y - cy;
  const d = Math.hypot(dx, dy);
  if (d < 1) { dx = 1; dy = 0; } else { dx /= d; dy /= d; }
  for (let i = 0; i < 14; i++) {
    n.x = Math.min(WORLD_W - n.r, Math.max(n.r, n.x + dx * 34));
    n.y = Math.min(WORLD_H - n.r, Math.max(n.r, n.y + dy * 34));
    const still = partners.some(o => Math.hypot(n.x - o.x, n.y - o.y) < n.r + o.r + 26);
    if (!still) break;
  }
  place(n); savePos(); renderSeams();
  statusEl.textContent = '解散しました';
}
function pairPath(wa, wb, ra, rb) {
  const Ra = ra + 8, Rb = rb + 8;
  const dx = wb.x - wa.x, dy = wb.y - wa.y, D = Math.hypot(dx, dy) || 1;
  const ux = dx / D, uy = dy / D;
  const cosf = Math.max(-1, Math.min(1, (Ra - Rb) / D)), phi = Math.acos(cosf), sinf = Math.sin(phi);
  const n1 = { x: ux * cosf - uy * sinf, y: uy * cosf + ux * sinf };
  const n2 = { x: ux * cosf + uy * sinf, y: uy * cosf - ux * sinf };
  const a1 = (wa.x + Ra * n1.x) + ' ' + (wa.y + Ra * n1.y), b1 = (wb.x + Rb * n1.x) + ' ' + (wb.y + Rb * n1.y);
  const b2 = (wb.x + Rb * n2.x) + ' ' + (wb.y + Rb * n2.y), a2 = (wa.x + Ra * n2.x) + ' ' + (wa.y + Ra * n2.y);
  const largeB = (360 - 2 * phi * 180 / Math.PI) > 180 ? 1 : 0;
  const largeA = (2 * phi * 180 / Math.PI) > 180 ? 1 : 0;
  return 'M ' + a1 + ' L ' + b1 + ' A ' + Rb + ' ' + Rb + ' 0 ' + largeB + ' 0 ' + b2 + ' L ' + a2 + ' A ' + Ra + ' ' + Ra + ' 0 ' + largeA + ' 0 ' + a1 + ' Z';
}
function toggleLink(a, b) {
  const i = settings.links.findIndex(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
  if (i >= 0) { settings.links.splice(i, 1); statusEl.textContent = 'リンクを切りました'; }
  else { settings.links.push({ a, b }); statusEl.textContent = 'リンクしました'; }
  scheduleSettingsSave(); renderSeams();
}

function renderSeams() {
  seams.querySelectorAll('line, path, text').forEach(el => el.remove());
  const NS = 'http://www.w3.org/2000/svg';
  const byNode = new Map(nodes.map(n => [n.id, n]));
  // リンク：少し弧を描く糸
  for (const L of settings.links) {
    const a = byNode.get(L.a), b = byNode.get(L.b);
    if (!a || !b) continue;
    const wa = warpPoint(a.x, a.y), wb = warpPoint(b.x, b.y);
    const dx = wb.x - wa.x, dy = wb.y - wa.y, d = Math.hypot(dx, dy) || 1;
    const cxp = (wa.x + wb.x) / 2 - dy / d * Math.min(60, d * 0.18);
    const cyp = (wa.y + wb.y) / 2 + dx / d * Math.min(60, d * 0.18);
    const dd = 'M ' + wa.x + ' ' + wa.y + ' Q ' + cxp + ' ' + cyp + ' ' + wb.x + ' ' + wb.y;
    const glow = document.createElementNS(NS, 'path');
    glow.setAttribute('d', dd); glow.setAttribute('fill', 'none');
    glow.setAttribute('stroke', '#cfe3ae'); glow.setAttribute('stroke-width', '9');
    glow.setAttribute('opacity', '0.26'); glow.setAttribute('stroke-linecap', 'round');
    seams.appendChild(glow);
    const line = document.createElementNS(NS, 'path');
    line.setAttribute('d', dd); line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'rgba(246,249,232,0.92)'); line.setAttribute('stroke-width', '2.2');
    line.setAttribute('stroke-linecap', 'round');
    seams.appendChild(line);
    if (L.label) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 0.25 * wa.x + 0.5 * cxp + 0.25 * wb.x);
      t.setAttribute('y', 0.25 * wa.y + 0.5 * cyp + 0.25 * wb.y);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'linklabel');
      t.textContent = L.label;
      seams.appendChild(t);
    }
  }
  // ペア（ひっつき）：2つを包む淡い緑のカプセル型の縁
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    const wa = warpPoint(a.x, a.y), wb = warpPoint(b.x, b.y);
    const ra = a.r * wa.k, rb = b.r * wb.k;
    const d = Math.hypot(wa.x - wb.x, wa.y - wb.y);
    if (Math.abs(d - (ra + rb)) <= 18 && d > 1) {
      const mk = (w, op, blur) => {
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', wa.x); ln.setAttribute('y1', wa.y); ln.setAttribute('x2', wb.x); ln.setAttribute('y2', wb.y);
        ln.setAttribute('stroke', '#a9c48d'); ln.setAttribute('stroke-width', w); ln.setAttribute('stroke-linecap', 'round');
        ln.setAttribute('opacity', op); if (blur) ln.setAttribute('filter', 'url(#soft)');
        seams.appendChild(ln);
      };
      mk(30, 0.4, true); mk(3, 0.25, false);
    }
  }
}
</script>
<script>
// ===== 操作（パン／ズーム／ドラッグ／吸着／カメラ） =====
const pointers = new Map();
let dragNode = null, dragOff = { x: 0, y: 0 }, dragMoved = false, snapTarget = null;
let linkMode = false;
let linkAsk = null;
let dragGroup = [], dragGroupIds = new Set(), dragStartPartners = new Set();
function buildGroup(n) {
  const seen = new Map([[n.id, n]]);
  const queue = [n];
  while (queue.length) {
    const c = queue.shift();
    for (const o of nodes) {
      if (seen.has(o.id)) continue;
      const d = Math.hypot(c.x - o.x, c.y - o.y);
      if (Math.abs(d - (c.r + o.r)) <= 22) { seen.set(o.id, o); queue.push(o); }
    }
  }
  return [...seen.values()].map(m => ({ node: m, dx: m.x - n.x, dy: m.y - n.y }));
}
let panStart = null, pinchStart = null, camAnim = null;

function toWorld(cx, cy) {
  const r = stage.getBoundingClientRect();
  return { x: (cx - r.left - view.x) / view.s, y: (cy - r.top - view.y) / view.s };
}
function cancelCam() { if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; } }
function animateView(to, dur) {
  cancelCam();
  const from = { ...view }, t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    view = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, s: from.s + (to.s - from.s) * e };
    applyView();
    camAnim = k < 1 ? requestAnimationFrame(step) : null;
  };
  camAnim = requestAnimationFrame(step);
}
function fitView(anim) {
  const r = stage.getBoundingClientRect();
  const s = Math.min(r.width / WORLD_W, r.height / WORLD_H) * 1.02;
  const to = { s, x: (r.width - WORLD_W * s) / 2, y: (r.height - WORLD_H * s) / 2 };
  if (anim) animateView(to, 380); else { view = to; applyView(); }
}
function openView() {
  const r = stage.getBoundingClientRect();
  const fitS = Math.min(r.width / WORLD_W, r.height / WORLD_H) * 1.02;
  const s = Math.min(1.6, fitS * 2.1);
  view = { s, x: r.width / 2 - (WORLD_W / 2) * s, y: r.height / 2 - (WORLD_H / 2) * s };
  applyView();
}
function centerOn(n) {
  const r = stage.getBoundingClientRect();
  const s = Math.max(view.s, 1.45);
  animateView({ s, x: r.width / 2 - n.x * s, y: r.height / 2 - n.y * s }, 430);
}
function select(id) {
  selectedId = id;
  nodes.forEach(n => n.el.classList.toggle('selected', n.id === id));
  renderDetail();
}
function savePos() {
  const m = {};
  nodes.forEach(n => { m[n.id] = { x: Math.round(n.x), y: Math.round(n.y) }; });
  settings.pos[currentParent] = m;
  scheduleSettingsSave();
}
async function saveLayoutRemote() {
  const content = JSON.stringify(settings);
  if (layoutRowId) {
    const { error } = await sb.from('wiki_pages').update({ content }).eq('id', layoutRowId);
    if (!error) { const r = byId.get(layoutRowId); if (r) r.content = content; }
  } else {
    const id = crypto.randomUUID();
    const row = { id, parent_id: KEPOS_ID, title: 'fuwa-layout', kind: 'page', content, sort_order: 9999, owner_id: null };
    const { error } = await sb.from('wiki_pages').insert(row);
    if (!error) { layoutRowId = id; rows.push({ ...row }); byId.set(id, { ...row }); }
  }
}

stage.addEventListener('pointerdown', (ev) => {
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  cancelCam();
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinchStart = { d: Math.hypot(p.x - q.x, p.y - q.y), cx: (p.x + q.x) / 2, cy: (p.y + q.y) / 2, view: { ...view } };
    dragNode = null; panStart = null;
    return;
  }
  const nodeEl = ev.target.closest('.node');
  if (nodeEl) {
    const n = nodes.find(x => x.id === nodeEl.dataset.id);
    if (n) {
      let w = toWorld(ev.clientX, ev.clientY);
      if (fisheyeOn) w = unwarpPoint(w.x, w.y);
      dragNode = n; dragOff = { x: n.x - w.x, y: n.y - w.y }; dragMoved = false; snapTarget = null;
      dragGroup = buildGroup(n);
      dragGroupIds = new Set(dragGroup.map(m => m.node.id));
      dragStartPartners = new Set(dragGroup.filter(m => m.node !== n).map(m => m.node.id));
      dragGroup.forEach(m => m.node.el.classList.add('dragging'));
      stage.setPointerCapture(ev.pointerId);
    }
  } else {
    panStart = { x: ev.clientX, y: ev.clientY, view: { ...view } };
    stage.setPointerCapture(ev.pointerId);
  }
});

stage.addEventListener('pointermove', (ev) => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinchStart && pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y), cx = (p.x + q.x) / 2, cy = (p.y + q.y) / 2;
    const r = stage.getBoundingClientRect();
    const s = Math.min(2.4, Math.max(0.3, pinchStart.view.s * d / pinchStart.d));
    const wx = (pinchStart.cx - r.left - pinchStart.view.x) / pinchStart.view.s;
    const wy = (pinchStart.cy - r.top - pinchStart.view.y) / pinchStart.view.s;
    view = { s, x: cx - r.left - wx * s + (cx - pinchStart.cx) * 0, y: cy - r.top - wy * s };
    applyView();
    return;
  }
  if (dragNode) {
    let w = toWorld(ev.clientX, ev.clientY);
    if (fisheyeOn) w = unwarpPoint(w.x, w.y);
    let nx = w.x + dragOff.x, ny = w.y + dragOff.y;
    if (Math.hypot(nx - dragNode.x, ny - dragNode.y) > 2) dragMoved = true;
    nx = Math.min(WORLD_W - dragNode.r, Math.max(dragNode.r, nx));
    ny = Math.min(WORLD_H - dragNode.r, Math.max(dragNode.r, ny));
    snapTarget = null;
    for (const o of nodes) {
      if (o === dragNode || dragGroupIds.has(o.id)) continue;
      const d = Math.hypot(nx - o.x, ny - o.y), want = dragNode.r + o.r + 4;
      if (Math.abs(d - want) < 30 && d > 1) {
        const k = want / d;
        nx = o.x + (nx - o.x) * k; ny = o.y + (ny - o.y) * k;
        snapTarget = o; dragMoved = true;
        break;
      }
    }
    dragNode.x = nx; dragNode.y = ny; place(dragNode);
    for (const m of dragGroup) {
      if (m.node === dragNode) continue;
      m.node.x = Math.min(WORLD_W - m.node.r, Math.max(m.node.r, nx + m.dx));
      m.node.y = Math.min(WORLD_H - m.node.r, Math.max(m.node.r, ny + m.dy));
      place(m.node);
    }
    nodes.forEach(o => o.el.classList.toggle('snapcand', o === snapTarget));
    renderSeams();
    return;
  }
  if (panStart) {
    view = { ...panStart.view, x: panStart.view.x + (ev.clientX - panStart.x), y: panStart.view.y + (ev.clientY - panStart.y) };
    applyView();
  }
});

function endPointer(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (dragNode) {
    const n = dragNode;
    dragGroup.forEach(m => m.node.el.classList.remove('dragging'));
    nodes.forEach(o => o.el.classList.remove('snapcand'));
    if (dragMoved) {
      savePos(); renderSeams();
      const o = pairPartner(n);
      if (o && !dragStartPartners.has(o.id) && !isLinked(n.id, o.id)) { linkAsk = { a: n.id, b: o.id }; renderDetail(); }
    }
    else if (linkMode && selectedId && selectedId !== n.id) { toggleLink(selectedId, n.id); linkMode = false; renderDetail(); }
    else if (linkMode && selectedId === n.id) { linkMode = false; renderDetail(); }
    else if (selectedId === n.id) { linkAsk = null; if (n.kind === 'folder') { buildLevel(n.id); fitView(true); } else openSheet(n); }
    else { linkAsk = null; select(n.id); centerOn(n); }
    dragNode = null; snapTarget = null; dragGroup = []; dragGroupIds = new Set(); dragStartPartners = new Set();
    return;
  }
  if (panStart) {
    const moved = Math.hypot(ev.clientX - panStart.x, ev.clientY - panStart.y);
    if (moved < 6 && !ev.target.closest('.node')) select(null);
    panStart = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', (ev) => {
  ev.preventDefault(); cancelCam();
  const r = stage.getBoundingClientRect();
  const wx = (ev.clientX - r.left - view.x) / view.s, wy = (ev.clientY - r.top - view.y) / view.s;
  const s = Math.min(2.4, Math.max(0.3, view.s * (ev.deltaY < 0 ? 1.09 : 0.92)));
  view = { s, x: ev.clientX - r.left - wx * s, y: ev.clientY - r.top - wy * s };
  applyView();
}, { passive: false });

// ===== 本文シート =====
const sheet = document.getElementById('sheet');
function openSheet(n) {
  const row = byId.get(n.id);
  document.getElementById('sheetTitle').textContent = n.title;
  document.getElementById('sheetBody').textContent = (row && row.content) ? row.content : '（本文は空です）';
  sheet.classList.add('open');
}
document.getElementById('sheetClose').addEventListener('click', () => sheet.classList.remove('open'));
sheet.addEventListener('click', (ev) => { if (ev.target === sheet) sheet.classList.remove('open'); });

// ===== ボタン =====
document.getElementById('btnFit').addEventListener('click', () => { select(null); fitView(true); });
document.getElementById('btnReset').addEventListener('click', () => {
  delete settings.pos[currentParent];
  scheduleSettingsSave();
  buildLevel(currentParent); fitView(true);
});
document.getElementById('btnFish').addEventListener('click', () => {
  fisheyeOn = !fisheyeOn;
  document.getElementById('btnFish').classList.toggle('on', fisheyeOn);
  document.getElementById('fishBar').classList.toggle('open', fisheyeOn);
  layoutAll();
});
document.getElementById('fishRange').addEventListener('input', (e) => {
  fishK = (e.target.value / 100) * 1.1;
  if (fisheyeOn) layoutAll();
});
function applyTheme() {
  const h = new Date().getHours();
  const night = (h >= 17 || h < 5);
  document.body.classList.toggle('night', night);
  document.body.classList.toggle('day', !night);
}
applyTheme();
setInterval(applyTheme, 60000);
async function reloadData() {
  statusEl.textContent = '更新中…';
  const { data, error } = await sb.from('wiki_pages').select('*').order('sort_order', { ascending: true });
  if (error) { statusEl.textContent = '更新に失敗しました：' + error.message; return; }
  rows = data || [];
  byId = new Map(rows.map(r => [r.id, r]));
  const lr = rows.find(r => r.title === 'fuwa-layout' && r.kind === 'page');
  if (lr) { layoutRowId = lr.id; try { settings = normalizeSettings(JSON.parse(lr.content || '{}')); } catch (e) {} }
  if (currentParent !== 'root' && !byId.has(currentParent)) currentParent = 'root';
  linkMode = false; linkAsk = null;
  buildLevel(currentParent);
  statusEl.textContent = '更新しました（全 ' + rows.length + ' ページ）';
}
document.getElementById('btnReload').addEventListener('click', reloadData);
window.addEventListener('resize', () => fitView(false));

// ===== パスキー =====
const lockEl = document.getElementById('lock');
const lockInput = document.getElementById('lockInput');
const lockMsg = document.getElementById('lockMsg');
const UNLOCK_KEY = 'fuwaUnlockV1';
try { const t = +localStorage.getItem(UNLOCK_KEY) || 0; if (Date.now() - t < 7 * 24 * 3600 * 1000) lockEl.classList.add('hide'); } catch (e) {}
function tryUnlock() {
  if (lockInput.value === '2461') {
    try { localStorage.setItem(UNLOCK_KEY, String(Date.now())); } catch (e) {}
    lockEl.classList.add('hide');
  } else {
    lockMsg.textContent = 'ちがうみたい ( ･᷄-･᷅ ) もういちど';
    lockEl.classList.remove('shake'); void lockEl.offsetWidth; lockEl.classList.add('shake');
    lockInput.value = '';
  }
}
document.getElementById('lockBtn').addEventListener('click', tryUnlock);
lockInput.addEventListener('input', () => { if (lockInput.value.length === 4) tryUnlock(); });
lockInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

// ===== 編集（新規・編集・削除） =====
const editorEl = document.getElementById('editor');
const edTitle = document.getElementById('edTitle'), edBody = document.getElementById('edBody');
const edHeading = document.getElementById('edHeading'), edDelete = document.getElementById('edDelete');
let editingId = null, edKind = 'page';
function setKind(k) {
  edKind = k;
  document.getElementById('kindPage').classList.toggle('on', k === 'page');
  document.getElementById('kindFolder').classList.toggle('on', k === 'folder');
}
document.getElementById('kindPage').addEventListener('click', () => setKind('page'));
document.getElementById('kindFolder').addEventListener('click', () => setKind('folder'));
let edColor = 'auto';
function setEdColor(c) {
  edColor = c;
  document.querySelectorAll('#colorRow .cchip').forEach(ch => ch.classList.toggle('on', ch.dataset.color === c));
}
document.querySelectorAll('#colorRow .cchip').forEach(ch => ch.addEventListener('click', () => setEdColor(ch.dataset.color)));
function openEditor(n) {
  editingId = n ? n.id : null;
  setKind(n ? n.kind : 'page');
  setEdColor(n ? (settings.color[n.id] || 'auto') : 'auto');
  edHeading.textContent = n ? '編集' : '新規作成（' + (currentParent === 'root' ? 'トップ' : folderName(currentParent)) + 'の中）';
  edTitle.value = n ? n.title : '';
  const row = n ? byId.get(n.id) : null;
  edBody.value = row ? (row.content || '') : '';
  edDelete.style.display = n ? '' : 'none';
  editorEl.classList.add('open');
}
function closeEditor() { editorEl.classList.remove('open'); }
document.getElementById('edClose').addEventListener('click', closeEditor);
editorEl.addEventListener('click', (ev) => { if (ev.target === editorEl) closeEditor(); });
document.getElementById('btnNew').addEventListener('click', () => openEditor(null));

document.getElementById('edSave').addEventListener('click', async () => {
  const title = edTitle.value.trim();
  if (!title) { alert('タイトルを入れてください'); return; }
  const body = edBody.value;
  if (editingId) {
    const { error } = await sb.from('wiki_pages').update({ title, kind: edKind, content: body }).eq('id', editingId);
    if (error) { alert(error.message); return; }
    const r = byId.get(editingId);
    if (r) Object.assign(r, { title, kind: edKind, content: body });
    if (edColor === 'auto') delete settings.color[editingId]; else settings.color[editingId] = edColor;
    scheduleSettingsSave();
    const keep = editingId;
    closeEditor(); buildLevel(currentParent); select(keep);
    statusEl.textContent = '☁️ 保存しました';
  } else {
    const id = crypto.randomUUID();
    const parent_id = currentParent === 'root' ? null : currentParent;
    const order = childrenOf(currentParent).length;
    const row = { id, parent_id, title, kind: edKind, content: body, sort_order: order, owner_id: null };
    const { error } = await sb.from('wiki_pages').insert(row);
    if (error) { alert(error.message); return; }
    rows.push({ ...row }); byId.set(id, { ...row });
    if (edColor !== 'auto') { settings.color[id] = edColor; scheduleSettingsSave(); }
    closeEditor(); buildLevel(currentParent);
    const n = nodes.find(x => x.id === id);
    if (n) { select(id); centerOn(n); }
    statusEl.textContent = '☁️ 作成しました';
  }
});

edDelete.addEventListener('click', async () => {
  if (!editingId) return;
  const r = byId.get(editingId);
  if (!r) return;
  if (!confirm('「' + r.title + '」を削除しますか？（中のページも削除されます）')) return;
  const ids = new Set([editingId]);
  let changed = true;
  while (changed) {
    changed = false;
    for (const x of rows) if (ids.has(x.parent_id) && !ids.has(x.id)) { ids.add(x.id); changed = true; }
  }
  const { error } = await sb.from('wiki_pages').delete().in('id', [...ids]);
  if (error) { alert(error.message); return; }
  rows = rows.filter(x => !ids.has(x.id));
  ids.forEach(id => { byId.delete(id); delete settings.color[id]; });
  settings.links = settings.links.filter(l => !ids.has(l.a) && !ids.has(l.b));
  scheduleSettingsSave();
  closeEditor(); buildLevel(currentParent);
  statusEl.textContent = '☁️ 削除しました';
});

// ===== リンクメモ =====
const lsEl = document.getElementById('linkSheet');
function openLinkSheet(n) {
  document.getElementById('lsTitle').textContent = 'リンクメモ（' + n.title + '）';
  const rowsEl = document.getElementById('lsRows');
  rowsEl.innerHTML = '';
  settings.links.filter(l => l.a === n.id || l.b === n.id).forEach(L => {
    const other = byId.get(L.a === n.id ? L.b : L.a);
    const div = document.createElement('div'); div.className = 'lsrow';
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = '🔗 ' + (other ? other.title : '?');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = L.label || '';
    inp.placeholder = 'タイトル（関係の名前）';
    inp.dataset.linkKey = L.a + '|' + L.b;
    inp.dataset.role = 'title';
    div.appendChild(who); div.appendChild(inp);
    const ta = document.createElement('textarea');
    ta.value = L.body || '';
    ta.placeholder = '本文（この関係について）';
    ta.dataset.linkKey = L.a + '|' + L.b;
    ta.dataset.role = 'body';
    div.appendChild(ta);
    const cut = document.createElement('button');
    cut.type = 'button'; cut.className = 'lscut'; cut.textContent = 'リンクを切る';
    cut.dataset.linkKey = L.a + '|' + L.b;
    cut.addEventListener('click', () => {
      if (!confirm('このリンクを切りますか？')) return;
      const [a, b] = cut.dataset.linkKey.split('|');
      settings.links = settings.links.filter(l => !(l.a === a && l.b === b));
      scheduleSettingsSave(); renderSeams(); renderDetail();
      div.remove();
      if (!rowsEl.querySelector('.lsrow')) rowsEl.textContent = 'リンクがありません';
    });
    div.appendChild(cut);
    rowsEl.appendChild(div);
  });
  if (!rowsEl.children.length) rowsEl.textContent = 'リンクがありません';
  lsEl.classList.add('open');
}
document.getElementById('lsClose').addEventListener('click', () => lsEl.classList.remove('open'));
lsEl.addEventListener('click', (ev) => { if (ev.target === lsEl) lsEl.classList.remove('open'); });
document.getElementById('lsSave').addEventListener('click', () => {
  lsEl.querySelectorAll('input[data-link-key], textarea[data-link-key]').forEach(inp => {
    const [a, b] = inp.dataset.linkKey.split('|');
    const L = settings.links.find(l => l.a === a && l.b === b);
    if (!L) return;
    if (inp.dataset.role === 'body') L.body = inp.value;
    else L.label = inp.value.trim();
  });
  scheduleSettingsSave(); renderSeams();
  lsEl.classList.remove('open');
  statusEl.textContent = 'リンクメモを保存しました';
});

load();
</script>
