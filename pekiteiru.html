<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ペキテイル</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf8; --line:#e3d9c8; --text:#33302a; --sub:#8a8172;
    --peki:#2e7d9b; --tail:#b0622f; --pengin:#5b7553; --mokkin:#7a5b8f; --myuzu:#c2517d; --nemu:#8a7d2e;
    --accent:#d98a2b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:15px; line-height:1.6;}
  .topbar{position:sticky; top:0; z-index:5; background:var(--bg);}
  header{border-bottom:1px solid var(--line); padding:10px 14px 8px;}
  header .ttl{font-size:19px; font-weight:700; letter-spacing:.04em;}
  header .sub{font-size:12px; color:var(--sub);}
  .tabs{display:flex; gap:8px; padding:10px 14px 0;}
  .tab{flex:1; text-align:center; padding:9px 0; border:1px solid var(--line); border-bottom:none; border-radius:12px 12px 0 0; background:#efe8da; color:var(--sub); font-weight:600; cursor:pointer;}
  .tab.on{background:var(--card); color:var(--text);}
  main{max-width:760px; margin:0 auto; padding:0 14px 90px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:0 0 14px 14px; padding:14px; min-height:50vh;}
  /* chat */
  .msg{display:flex; gap:8px; margin:0 0 14px;}
  .msg .av{flex:0 0 34px; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; margin-top:2px;}
  .msg .bd{flex:1; min-width:0;}
  .msg .hd{font-size:12px; color:var(--sub); margin-bottom:2px;}
  .msg .hd b{font-size:13px;}
  .msg .tx{background:#fff; border:1px solid var(--line); border-radius:4px 12px 12px 12px; padding:8px 11px; white-space:pre-wrap; word-break:break-word;}
  .a-peki .av{background:var(--peki);} .a-peki .hd b{color:var(--peki);}
  .a-tail .av{background:var(--tail);} .a-tail .hd b{color:var(--tail);}
  .a-pengin .av{background:var(--pengin);} .a-pengin .hd b{color:var(--pengin);}
  .a-mokkin .av{background:var(--mokkin);} .a-mokkin .hd b{color:var(--mokkin);}
  .a-myuzu .av{background:var(--myuzu);} .a-myuzu .hd b{color:var(--myuzu);}
  .a-nemu .av{background:var(--nemu);} .a-nemu .hd b{color:var(--nemu);}
  .composer{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .composer .in{max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;}
  .composer textarea{flex:1; border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:15px; font-family:inherit; resize:none; max-height:110px; background:#fff;}
  .btn{border:none; border-radius:12px; padding:10px 16px; font-size:15px; font-weight:700; background:var(--accent); color:#fff; cursor:pointer;}
  .btn.sub2{background:#efe8da; color:var(--text); border:1px solid var(--line);}
  .btn:active{opacity:.75;}
  /* knowledge */
  .kitem{border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:10px; background:#fff; cursor:pointer;}
  .kitem .kt{font-weight:700; font-size:16px;}
  .kitem .km{font-size:12px; color:var(--sub);}
  .kitem .kp{font-size:13.5px; color:#55503f; margin-top:3px; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .kview .kt{font-size:19px; font-weight:700; margin-bottom:2px;}
  .kview .km{font-size:12px; color:var(--sub); margin-bottom:10px;}
  .kview .kb{white-space:pre-wrap; word-break:break-word; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px;}
  .svgbox{background:#fffdf6; border:1px dashed var(--line); border-radius:10px; padding:8px; margin:8px 0; white-space:normal;}
  .rowbtns{display:flex; gap:8px; margin:12px 0;}
  input.tf, textarea.tf, select.tf{width:100%; border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:15px; font-family:inherit; background:#fff; margin-bottom:10px;}
  textarea.tf{min-height:180px; resize:vertical;}
  /* tree view */
  .treewrap{background:linear-gradient(#f3ecd9, #fdfaf1); border:1px solid var(--line); border-radius:12px; padding:6px 2px 2px;}
  .treewrap svg{width:100%; height:auto; display:block;}
  .branch{cursor:pointer;}
  .branch:hover .bleaf{opacity:.75;}
  .branch .pill{fill:#fffdf8; stroke:#d9cdae; stroke-width:1;}
  .branch:hover .pill{stroke:var(--accent); stroke-width:1.6;}
  .branch text{font-size:13px; fill:var(--text); font-weight:600;}
  .branch:hover text{fill:var(--accent);}
  /* gate */
  #gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
  #gate .box{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:340px; text-align:center;}
  #gate input{width:100%; border:1px solid var(--line); border-radius:12px; padding:10px; font-size:16px; text-align:center; margin:10px 0;}
  .names{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px 0 4px;}
  .names button{border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 13px; font-size:14px; cursor:pointer;}
  .names button.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
  #gateErr{color:#c0392b; font-size:13px; min-height:18px;}
  #banner{position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-80px); background:#33302a; color:#fff; padding:9px 16px; border-radius:999px; font-size:13.5px; z-index:60; transition:transform .25s; max-width:92vw; text-align:center;}
  #banner.show{transform:translateX(-50%) translateY(0);}
  #banner.err{background:#a33;}
  .empty{color:var(--sub); text-align:center; padding:26px 0; font-size:14px;}
  .whoami{font-size:12px; color:var(--sub); text-align:right; padding:6px 2px 0;}
  .whoami a{color:var(--sub);}
</style>
</head>
<body>
<div id="banner"></div>

<div id="gate">
  <div class="box">
    <div style="font-size:22px; font-weight:700;">ペキテイル</div>
    <div style="font-size:13px; color:var(--sub);">ペキとテイルのおしゃべりと、知のまとめの場所</div>
    <input id="gatePass" type="password" inputmode="numeric" placeholder="パスワード" autocomplete="off">
    <div style="font-size:13px; color:var(--sub);">あなたはだれ？</div>
    <div class="names" id="gateNames">
      <button data-n="ペキ">ペキ</button>
      <button data-n="テイル">テイル</button>
      <button data-n="みゅず">みゅず</button>
      <button data-n="ぺん銀">ぺん銀</button>
      <button data-n="もっ金">もっ金</button>
      <button data-n="ねむ">ねむ</button>
    </div>
    <div id="gateErr"></div>
    <button class="btn" id="gateGo" style="width:100%; margin-top:6px;">はいる</button>
  </div>
</div>

<div class="topbar">
<header>
  <div class="ttl">ペキテイル <span style="font-size:12px; color:var(--sub); font-weight:400;" id="buildStr"></span></div>
  <div class="sub">ペキ・テイル・みゅずの文通チャット＆知のまとめコーナー <button class="btn sub2" id="refreshBtn" style="padding:4px 12px; font-size:13px; border-radius:999px; margin-left:6px;">↻ 更新</button></div>
</header>
<div class="tabs" style="max-width:760px; margin:0 auto;">
  <div class="tab on" id="tabChat">💬 チャット</div>
  <div class="tab" id="tabKnow">📚 知のまとめ</div>
  <div class="tab" id="tabTree">🌳 木</div>
</div>
</div>
<main>
  <div class="panel" id="panelChat">
    <div id="chatList"></div>
    <div class="whoami"><span id="whoLabel"></span> として書く（<a href="#" id="switchUser">かえる</a>）</div>
  </div>
  <div class="panel" id="panelKnow" style="display:none;">
    <div id="knowMain"></div>
  </div>
  <div class="panel" id="panelTree" style="display:none;">
    <div id="treeMain"></div>
  </div>
</main>
<div class="composer" id="composer">
  <div class="in">
    <textarea id="chatInput" rows="2" placeholder="メッセージを書く"></textarea>
    <button class="btn" id="chatSend">送る</button>
  </div>
</div>

<script>
const BUILD = '2026-11-27-2143';
const SB_URL = 'https://slofvjhrlbgiqvwyxqvo.supabase.co';
const SB_KEY = 'sb_publishable_m7cgZnABDuFA1P0HKQG_4w_KgAXHLrh';
const ROW_ID = 'be67a0d9-154c-408c-a300-ffcda2800341';
const PASS = '2501';
const $ = s => document.querySelector(s);
const AUTHORS = {
  'ペキ':   {cls:'a-peki',   icon:'🐧'},
  'テイル': {cls:'a-tail',   icon:'🌿'},
  'みゅず': {cls:'a-myuzu',  icon:'🎵'},
  'ぺん銀': {cls:'a-pengin', icon:'👑'},
  'もっ金': {cls:'a-mokkin', icon:'👑'},
  'ねむ':   {cls:'a-nemu',   icon:'🐱'}
};
const TREES = {
  seigo: {name:'整合の木',   owner:'テイル', color:'#b0622f', leaf:'#7fae5c', leaf2:'#a9c97e'},
  kaiso: {name:'階層性の木', owner:'みゅず', color:'#c2517d', leaf:'#5c9e8f', leaf2:'#8fc4a9'},
  saiki: {name:'再帰性の木', owner:'ペキ',   color:'#2e7d9b', leaf:'#5b8fc4', leaf2:'#93bce0'}
};
function treeOf(k){
  if(k.tree && TREES[k.tree]) return k.tree;
  const t = k.title || '';
  if(t.includes('整合')) return 'seigo';
  if(t.includes('再帰')) return 'saiki';
  if(t.includes('階層') || t.includes('枠') || t.includes('スケール')) return 'kaiso';
  if(k.createdBy === 'テイル') return 'seigo';
  if(k.createdBy === 'みゅず') return 'kaiso';
  if(k.createdBy === 'ペキ') return 'saiki';
  return 'seigo';
}
let state = null, baseContent = null, myName = localStorage.getItem('pekiteiru_name') || '';
let tab = 'chat', openKnowId = null, editingKnowId = null; // editingKnowId: 'new' | id | null

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let bannerTimer = null;
function showBanner(msg, isErr){
  const b = $('#banner'); b.textContent = msg; b.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.className = ''; }, 5000);
}
function sanitizeSVG(svg){
  let s = String(svg || '');
  s = s.replace(/<\s*(script|foreignObject|iframe|object|embed|link|meta|style)[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
  s = s.replace(/<\s*(script|foreignObject|iframe|object|embed|link|meta|style)\b[^>]*>/gi, '');
  s = s.replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  s = s.replace(/(href|xlink:href)\s*=\s*("([^"]*)"|'([^']*)')/gi, (m, a, q, v1, v2) => {
    const v = (v1 !== undefined ? v1 : v2) || '';
    return v.startsWith('#') ? m : a + '="#"';
  });
  s = s.replace(/javascript\s*:/gi, '');
  if(!/<svg[\s>]/i.test(s)) return '';
  if(!/xmlns\s*=/.test(s)) s = s.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  s = s.replace(/<svg([^>]*)>/i, (m, attrs) => {
    if(!/style\s*=/.test(attrs)) attrs += ' style="max-width:100%;height:auto;display:block;margin:8px auto;"';
    return '<svg' + attrs + '>';
  });
  return s;
}
function renderBodyHTML(body){
  const parts = String(body || '').split(/```svg\s*\n?/i);
  let html = '';
  parts.forEach((part, i) => {
    if(i === 0){ html += esc(part); return; }
    const end = part.indexOf('```');
    const svgRaw = end >= 0 ? part.slice(0, end) : part;
    const rest = end >= 0 ? part.slice(end + 3) : '';
    const svg = sanitizeSVG(svgRaw);
    html += svg ? '<div class="svgbox">' + svg + '</div>' : '<div class="svgbox" style="color:var(--sub);">[図を表示できなかったよ]</div>';
    html += esc(rest);
  });
  return html;
}
function previewText(body){
  return String(body || '').replace(/```svg[\s\S]*?(```|$)/gi, '［図］');
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ================= supabase ================= */
async function sbFetch(){
  const res = await fetch(SB_URL + '/rest/v1/wiki_pages?id=eq.' + ROW_ID + '&select=content,updated_at', {headers:{'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY}});
  if(!res.ok) throw new Error('読込に失敗したよ（' + res.status + '）');
  const rows = await res.json();
  if(!rows.length) throw new Error('データの行が見つからないよ');
  return rows[0].content;
}
function normalize(st){
  st.chat = Array.isArray(st.chat) ? st.chat : [];
  st.knowledge = Array.isArray(st.knowledge) ? st.knowledge : [];
  st.nextChatId = st.nextChatId || (st.chat.reduce((m,c)=>Math.max(m,c.id),0) + 1);
  st.nextKnowledgeId = st.nextKnowledgeId || (st.knowledge.reduce((m,k)=>Math.max(m,k.id),0) + 1);
  return st;
}
async function loadState(){
  const content = await sbFetch();
  baseContent = content;
  state = normalize(JSON.parse(content));
}
async function saveState(){
  const fresh = await sbFetch();
  if(fresh !== baseContent){
    showBanner('誰かが更新したみたい。再読み込みするね', true);
    await loadState(); render();
    throw new Error('conflict');
  }
  const body = JSON.stringify(state);
  const res = await fetch(SB_URL + '/rest/v1/wiki_pages?id=eq.' + ROW_ID, {
    method:'PATCH',
    headers:{'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
    body: JSON.stringify({content: body})
  });
  if(!res.ok) throw new Error('保存に失敗したよ（' + res.status + '）');
  baseContent = body;
}
async function commit(mutFn, okMsg){
  try{ mutFn(); await saveState(); render(); if(okMsg) showBanner(okMsg, false); return true; }
  catch(e){ if(e.message !== 'conflict') showBanner(e.message || 'うまくいかなかったよ', true); return false; }
}

/* ================= render ================= */
function render(){
  $('#buildStr').textContent = BUILD;
  $('#whoLabel').textContent = myName;
  $('#tabChat').className = 'tab' + (tab === 'chat' ? ' on' : '');
  $('#tabKnow').className = 'tab' + (tab === 'know' ? ' on' : '');
  $('#tabTree').className = 'tab' + (tab === 'tree' ? ' on' : '');
  $('#panelChat').style.display = tab === 'chat' ? '' : 'none';
  $('#panelKnow').style.display = tab === 'know' ? '' : 'none';
  $('#panelTree').style.display = tab === 'tree' ? '' : 'none';
  $('#composer').style.display = tab === 'chat' ? '' : 'none';
  renderChat(); renderKnow(); renderTree();
}
function renderChat(){
  const el = $('#chatList');
  if(!state.chat.length){ el.innerHTML = '<div class="empty">まだ何もないよ。最初の一通をどうぞ。</div>'; return; }
  el.innerHTML = state.chat.slice().reverse().map(c => {
    const a = AUTHORS[c.author] || {cls:'', icon:'💬'};
    return '<div class="msg ' + a.cls + '"><div class="av">' + a.icon + '</div><div class="bd">' +
      '<div class="hd"><b>' + esc(c.author) + '</b> ・ ' + fmtTime(c.at) + '</div>' +
      '<div class="tx">' + esc(c.text) + '</div></div></div>';
  }).join('');
}
function renderKnow(){
  const el = $('#knowMain');
  if(editingKnowId !== null){
    const k = editingKnowId === 'new' ? {title:'', body:''} : state.knowledge.find(x => x.id === editingKnowId);
    if(!k){ editingKnowId = null; renderKnow(); return; }
    const curTree = k.tree && TREES[k.tree] ? k.tree : '';
    const treeOpts = '<option value=""' + (curTree === '' ? ' selected' : '') + '>自動（タイトルや作者から振り分け）</option>' +
      Object.keys(TREES).map(key => '<option value="' + key + '"' + (curTree === key ? ' selected' : '') + '>🌳 ' + TREES[key].name + '（担当：' + TREES[key].owner + '）</option>').join('');
    el.innerHTML =
      '<input class="tf" id="kTitle" placeholder="タイトル" value="' + esc(k.title) + '">' +
      '<div style="font-size:13px; color:var(--sub); margin-bottom:4px;">木（どの木の枝にするか）</div>' +
      '<select class="tf" id="kTree">' + treeOpts + '</select>' +
      '<textarea class="tf" id="kBody" placeholder="まとめの本文（出典やリンクもここに）。図は ```svg と ``` で囲んでSVGを書くと表示される">' + esc(k.body) + '</textarea>' +
      '<div class="rowbtns"><button class="btn" id="kSave">保存する</button><button class="btn sub2" id="kCancel">やめる</button></div>';
    $('#kSave').onclick = async () => {
      const title = $('#kTitle').value.trim(), body = $('#kBody').value;
      const treeVal = $('#kTree').value;
      if(!title){ showBanner('タイトルを入れてね', true); return; }
      const now = new Date().toISOString();
      const ok = await commit(() => {
        if(editingKnowId === 'new'){
          const nk = {id: state.nextKnowledgeId++, title, body, updatedBy: myName, updatedAt: now, createdBy: myName, createdAt: now};
          if(treeVal) nk.tree = treeVal;
          state.knowledge.push(nk);
        } else {
          const t = state.knowledge.find(x => x.id === editingKnowId);
          t.title = title; t.body = body; t.updatedBy = myName; t.updatedAt = now;
          if(treeVal) t.tree = treeVal; else delete t.tree;
        }
      }, '保存したよ');
      if(ok){ const id = editingKnowId === 'new' ? state.knowledge[state.knowledge.length-1].id : editingKnowId; editingKnowId = null; openKnowId = id; render(); }
    };
    $('#kCancel').onclick = () => { editingKnowId = null; render(); };
    return;
  }
  if(openKnowId !== null){
    const k = state.knowledge.find(x => x.id === openKnowId);
    if(!k){ openKnowId = null; renderKnow(); return; }
    el.innerHTML =
      '<div class="kview"><div class="kt">' + esc(k.title) + '</div>' +
      '<div class="km">🌳 ' + TREES[treeOf(k)].name + '（担当：' + TREES[treeOf(k)].owner + '） ・ 最終更新：' + esc(k.updatedBy || '') + ' ・ ' + fmtTime(k.updatedAt) + '</div>' +
      '<div class="kb">' + renderBodyHTML(k.body) + '</div></div>' +
      '<div class="rowbtns"><button class="btn sub2" id="kBack">← 一覧へ</button><button class="btn" id="kEdit">編集する</button></div>';
    $('#kBack').onclick = () => { openKnowId = null; render(); };
    $('#kEdit').onclick = () => { editingKnowId = k.id; render(); };
    return;
  }
  let html = '<div class="rowbtns"><button class="btn" id="kNew">＋ 新しいまとめ</button></div>';
  if(!state.knowledge.length) html += '<div class="empty">まだまとめがないよ。△のこと、哲学者や科学者の知見を、ここに育てていく。</div>';
  html += state.knowledge.slice().sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||'')).map(k =>
    '<div class="kitem" data-k="' + k.id + '"><div class="kt">' + esc(k.title) + '</div>' +
    '<div class="km">🌳 ' + TREES[treeOf(k)].name + ' ・ ' + esc(k.updatedBy || '') + ' ・ ' + fmtTime(k.updatedAt) + '</div>' +
    '<div class="kp">' + esc(previewText(k.body)) + '</div></div>'
  ).join('');
  el.innerHTML = html;
  $('#kNew').onclick = () => { editingKnowId = 'new'; render(); };
  el.querySelectorAll('[data-k]').forEach(n => n.onclick = () => { openKnowId = Number(n.dataset.k); render(); });
}

function renderTree(){
  const el = $('#treeMain');
  if(!el) return;
  const W = 780, groundY = 500, H = 560;
  // each tree owns a third of the width; branches and labels stay inside it
  const centers = {seigo: 130, kaiso: 390, saiki: 650};
  const zones = {seigo: [0, 260], kaiso: [260, 520], saiki: [520, 780]};
  const byTree = {seigo: [], kaiso: [], saiki: []};
  state.knowledge.slice().sort((a,b) => a.id - b.id).forEach(k => byTree[treeOf(k)].push(k));
  let svg = '';
  // ground
  svg += '<path d="M0 ' + groundY + ' Q ' + (W/2) + ' ' + (groundY - 14) + ' ' + W + ' ' + groundY + ' L ' + W + ' ' + H + ' L 0 ' + H + ' Z" fill="#e6dcc4"/>';
  svg += '<path d="M0 ' + groundY + ' Q ' + (W/2) + ' ' + (groundY - 14) + ' ' + W + ' ' + groundY + '" fill="none" stroke="#b7a67f" stroke-width="3"/>';
  Object.keys(TREES).forEach(key => {
    const T = TREES[key], cx = centers[key], items = byTree[key];
    const n = items.length;
    const zx0 = zones[key][0], zx1 = zones[key][1];
    // attach heights spread up the trunk so the upper space is used too
    const step = n > 1 ? Math.min(62, 250 / (n - 1)) : 0;
    const slotY = i => groundY - 96 - i * step;
    const trunkTop = n ? Math.max(56, slotY(n - 1) - 58) : groundY - 120;
    // roots & trunk (tapers via two paths)
    svg += '<path d="M' + (cx - 13) + ' ' + groundY + ' C ' + (cx - 9) + ' ' + (groundY - 70) + ', ' + (cx - 6) + ' ' + (trunkTop + 40) + ', ' + (cx - 4) + ' ' + trunkTop +
           ' L ' + (cx + 4) + ' ' + trunkTop +
           ' C ' + (cx + 6) + ' ' + (trunkTop + 40) + ', ' + (cx + 9) + ' ' + (groundY - 70) + ', ' + (cx + 13) + ' ' + groundY + ' Z" fill="#8a6844"/>';
    svg += '<path d="M' + (cx - 13) + ' ' + groundY + ' q -14 4 -22 12 M' + (cx + 13) + ' ' + groundY + ' q 14 4 22 12" stroke="#8a6844" stroke-width="5" fill="none" stroke-linecap="round"/>';
    if(!n){
      // sprout only
      svg += '<path d="M' + cx + ' ' + trunkTop + ' q -12 -16 -22 -18 M' + cx + ' ' + trunkTop + ' q 12 -16 22 -18" stroke="#8a6844" stroke-width="4" fill="none" stroke-linecap="round"/>';
      svg += '<circle cx="' + (cx - 24) + '" cy="' + (trunkTop - 20) + '" r="7" fill="' + T.leaf + '"/>';
      svg += '<circle cx="' + (cx + 24) + '" cy="' + (trunkTop - 20) + '" r="7" fill="' + T.leaf2 + '"/>';
      svg += '<text x="' + cx + '" y="' + (trunkTop - 42) + '" text-anchor="middle" font-size="12" fill="#8a8172">まだ枝がないよ</text>';
    }
    items.forEach((k, i) => {
      // deterministic pseudo-random from id for an organic feel
      const rnd = Math.abs(Math.sin(k.id * 127.1 + i * 311.7)) % 1;
      const side = i % 2 === 0 ? -1 : 1;
      const baseY = slotY(i);
      const reach = 72 + rnd * 26; // max 98 < zone half-width 130
      const tipX = cx + side * reach;
      const tipY = baseY - 42 - rnd * 10;
      const ctrlX = cx + side * reach * 0.45;
      const ctrlY = baseY - 6;
      const wdt = Math.max(3, 7.5 - i * 0.55);
      // label: a white pill tag above the tip, clamped inside this tree's zone
      let title = k.title || '';
      if(title.length > 12) title = title.slice(0, 12) + '…';
      let tw = 0;
      for(const ch of title) tw += (ch.codePointAt(0) > 0xFF ? 13.2 : 7.4);
      const pillW = tw + 18, pillH = 24;
      let pcx = Math.min(Math.max(tipX, zx0 + pillW / 2 + 4), zx1 - pillW / 2 - 4);
      if(pillW > zx1 - zx0 - 8) pcx = (zx0 + zx1) / 2;
      const pillX = pcx - pillW / 2, pillY = Math.max(6, tipY - 48);
      svg += '<g class="branch" data-k="' + k.id + '">' +
        '<path d="M' + cx + ' ' + baseY + ' Q ' + ctrlX + ' ' + ctrlY + ' ' + tipX + ' ' + tipY + '" stroke="#8a6844" stroke-width="' + wdt.toFixed(1) + '" fill="none" stroke-linecap="round"/>' +
        '<circle class="bleaf" cx="' + tipX + '" cy="' + tipY + '" r="11" fill="' + T.leaf + '" opacity="0.9"/>' +
        '<circle class="bleaf" cx="' + (tipX + side * 9) + '" cy="' + (tipY - 8) + '" r="7.5" fill="' + T.leaf2 + '" opacity="0.9"/>' +
        '<circle class="bleaf" cx="' + (tipX - side * 7) + '" cy="' + (tipY - 10) + '" r="6" fill="' + T.leaf + '" opacity="0.75"/>' +
        '<rect class="pill" x="' + pillX.toFixed(1) + '" y="' + pillY.toFixed(1) + '" width="' + pillW.toFixed(1) + '" height="' + pillH + '" rx="12"/>' +
        '<text x="' + pcx.toFixed(1) + '" y="' + (pillY + 16.5).toFixed(1) + '" text-anchor="middle">' + esc(title) + '</text>' +
        '</g>';
    });
    // tree label under the ground
    svg += '<text x="' + cx + '" y="' + (groundY + 30) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + T.color + '">🌳 ' + T.name + '</text>';
    svg += '<text x="' + cx + '" y="' + (groundY + 50) + '" text-anchor="middle" font-size="12" fill="#8a8172">担当：' + T.owner + ' ・ 枝 ' + n + ' 本</text>';
  });
  el.innerHTML = '<div style="font-size:13px; color:var(--sub); margin-bottom:8px;">知のまとめは3本の木の枝として育つよ。枝の先のタイトルをタップすると、そのまとめが開く。</div>' +
    '<div class="treewrap"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + svg + '</svg></div>';
  el.querySelectorAll('[data-k]').forEach(g => g.onclick = () => {
    openKnowId = Number(g.dataset.k); editingKnowId = null; tab = 'know'; render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
}

/* ================= events ================= */
$('#tabChat').onclick = () => { tab = 'chat'; render(); };
$('#tabKnow').onclick = () => { tab = 'know'; render(); };
$('#tabTree').onclick = () => { tab = 'tree'; render(); };
$('#chatSend').onclick = async () => {
  const ta = $('#chatInput'); const text = ta.value.trim();
  if(!text) return;
  const ok = await commit(() => {
    state.chat.push({id: state.nextChatId++, author: myName, text, at: new Date().toISOString()});
  }, '送ったよ');
  if(ok){ ta.value = ''; window.scrollTo({top: 0, behavior:'smooth'}); }
};
$('#refreshBtn').onclick = async () => {
  try{ await loadState(); render(); showBanner('最新の状態にしたよ', false); }
  catch(e){ showBanner(e.message || '更新できなかったよ', true); }
};
$('#switchUser').onclick = e => {
  e.preventDefault();
  localStorage.removeItem('pekiteiru_ok_2501');
  location.reload();
};

/* gate */
let gateName = myName || '';
function paintGateNames(){
  document.querySelectorAll('#gateNames button').forEach(b => b.className = b.dataset.n === gateName ? 'on' : '');
}
document.querySelectorAll('#gateNames button').forEach(b => b.onclick = () => { gateName = b.dataset.n; paintGateNames(); });
$('#gateGo').onclick = async () => {
  if($('#gatePass').value.trim() !== PASS){ $('#gateErr').textContent = 'パスワードが違うみたい'; return; }
  if(!gateName){ $('#gateErr').textContent = 'だれか選んでね'; return; }
  myName = gateName;
  localStorage.setItem('pekiteiru_ok_2501', '1');
  localStorage.setItem('pekiteiru_name', myName);
  $('#gate').style.display = 'none';
  try{ await loadState(); render(); }catch(e){ showBanner(e.message, true); }
};

/* build self-check: if a newer build is live, reload once */
(async () => {
  try{
    const res = await fetch(location.pathname.split('/').pop() || 'pekiteiru.html', {cache:'no-store'});
    const t = await res.text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if(m && m[1] !== BUILD && sessionStorage.getItem('pekiteiruBuildReload') !== m[1]){
      sessionStorage.setItem('pekiteiruBuildReload', m[1]);
      location.reload();
    }
  }catch(e){}
})();

/* init */
(async () => {
  $('#buildStr').textContent = BUILD;
  paintGateNames();
  if(localStorage.getItem('pekiteiru_ok_2501') === '1' && myName){
    $('#gate').style.display = 'none';
    try{ await loadState(); render(); }catch(e){ showBanner(e.message, true); }
  }
})();
</script>
</body>
</html>
