<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自分Wiki 🐧</title><style>
:root{--bg:#f6f6f4;--panel:#fff;--line:#deded9;--text:#222;--muted:#777;--accent:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(246,246,244,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px}
.bar{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center}.brand{font-weight:700;font-size:18px;margin-right:auto}
button,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}button:hover{background:#f0f0ed}
main{max-width:900px;margin:0 auto;padding:22px 14px 60px}.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}.crumb span{cursor:pointer}.title{font-size:30px;margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:105px;cursor:pointer;transition:.15s}.item:hover{transform:translateY(-1px);box-shadow:0 4px 15px #0000000d}.icon{font-size:24px;margin-bottom:10px}.name{font-weight:650}.type{font-size:12px;color:var(--muted);margin-top:5px}
.article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;line-height:1.85}.article p{white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.search{width:190px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
dialog{border:1px solid var(--line);border-radius:16px;width:min(620px,92vw);padding:0;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0005}.dlg{padding:20px}.dlg h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.field textarea{min-height:180px;resize:vertical}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{color:var(--muted);padding:30px 5px}.hint{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:600px){.search{width:120px}.title{font-size:26px}.item{min-height:90px}}
</style></head>
<body>
<header><div class="bar">
<div class="brand">自分Wiki</div>
<input id="search" class="search" placeholder="🔍 検索">
<button onclick="goRoot()">⌂</button><button onclick="openNew()">＋</button>
</div></header>
<main id="app"></main>

<dialog id="editor"><div class="dlg">
<h2 id="dlgTitle">ページを追加</h2>
<div class="field"><label>名前</label><input id="fTitle"></div>
<div class="field"><label>種類</label><select id="fType"><option value="folder">フォルダ</option><option value="page">ページ</option></select></div>
<div class="field"><label>本文</label><textarea id="fBody" placeholder="このページの内容を書きます"></textarea></div>
<div class="dlg-actions"><button onclick="editor.close()">キャンセル</button><button onclick="saveItem()">保存</button></div>
</div></dialog>

<script>
const INITIAL=[{"id": "n0", "parent": "root", "title": "△", "type": "folder"}, {"id": "n1", "parent": "n0", "title": "組織", "type": "page", "body": "家族・部族・国家など、人間が作る組織と、その内側／外側の関係について考える。△という形で人間の階層構造を捉える。"}, {"id": "n2", "parent": "n0", "title": "競争", "type": "page", "body": "人が「1番」を目指す構造や、競い合う心について考える。競争そのものと、そこから生まれる位置争いを切り分ける。"}, {"id": "n3", "parent": "n0", "title": "GY▽XA", "type": "page", "body": "世界平和を目指すプロジェクト。すべての組織への関心から生まれ、「焦るな」を中心的なメッセージとする。△の命令としての競い合う心、盛り上げる方向の法則、平坦化とその先の崩壊などを扱う。"}, {"id": "n4", "parent": "n0", "title": "銀リテ", "type": "page", "body": "「銀リテラシー」。どこでも金・1番を目指さなくてもよい、という考え方。「多くの銀」「2番でもよい」という発想。ただし現在はポジション争い自体への関心が薄れている。"}, {"id": "n5", "parent": "n0", "title": "競い合う心", "type": "page", "body": "競争を生む心の動き。△の構造と結びついて考えているテーマ。"}, {"id": "n6", "parent": "n0", "title": "焦るな", "type": "page", "body": "GY▽XAの中心的なメッセージ。競争や変化の中で焦らないことを扱う。"}, {"id": "n7", "parent": "root", "title": "推論", "type": "folder"}, {"id": "n8", "parent": "n7", "title": "演繹", "type": "page", "body": "演繹・帰納・アブダクションの境界について考える。演繹も広い意味では推論の一種として捉える。"}, {"id": "n9", "parent": "n7", "title": "帰納", "type": "page", "body": "個別の事例から一般化する推論。アブダクションとの違いや共通点を検討した。"}, {"id": "n10", "parent": "n7", "title": "アブダクション", "type": "page", "body": "観察された事実から、それを説明しうる仮説を推論する考え方。科学的思考との関係を検討した。"}, {"id": "n11", "parent": "n7", "title": "言葉の曖昧さ", "type": "page", "body": "言葉は意味が固定されているようで、文脈によってフレームが変わる。言葉の定義そのものを問い直すテーマ。"}, {"id": "n12", "parent": "n7", "title": "アブダクション英語独習法", "type": "page", "body": "今井むつみ『アブダクション英語独習法』について検討した。英語学習における推論の扱いに関心がある。"}, {"id": "n13", "parent": "root", "title": "人格", "type": "folder"}, {"id": "n14", "parent": "n13", "title": "人格弱体化", "type": "page", "body": "人間を人格という単位で評価・序列化することへの疑問。行為の評価と人格そのものへの評価を分けて考える。"}, {"id": "n15", "parent": "n13", "title": "行為と人格", "type": "page", "body": "「人を尊重する」と「行為を尊重する」を区別する。法律や道徳の判断が人格評価へ飛躍することについて考える。"}, {"id": "n16", "parent": "n13", "title": "らしさが無い", "type": "page", "body": "自分には固定された本質や「らしさ」がない、という捉え方。分人主義とも関連する。"}, {"id": "n17", "parent": "n13", "title": "オートロジー", "type": "page", "body": "自己言及・自己記述に関わる考え方。自分自身について語ることの構造を考える。"}, {"id": "n18", "parent": "n13", "title": "オントロジー", "type": "page", "body": "存在についての捉え方。オートロジーとの対比から考える。"}, {"id": "n19", "parent": "root", "title": "自由", "type": "folder"}, {"id": "n20", "parent": "n19", "title": "自由という推論", "type": "page", "body": "自由そのものも、実体として存在するというより、人間が推論によって組み立てている可能性がある。教育の根本原則として自由を置くことへの疑問にもつながる。"}, {"id": "n21", "parent": "n19", "title": "自分ごとと世界ごと", "type": "page", "body": "「自分ごと」と「世界ごと」を混ぜることで、問題のフレームが変わってしまうことへの注意。"}, {"id": "n22", "parent": "n19", "title": "教育と推論", "type": "page", "body": "自由や学習を教育の前提にするのではなく、それ自体が推論の産物なのではないか、という問い。"}, {"id": "n23", "parent": "root", "title": "ドーパミン", "type": "folder"}, {"id": "n24", "parent": "n23", "title": "適切な排出量", "type": "page", "body": "最近の中心的な捉え方。オリンピックや人格とは切り離して、目的を「ドーパミンの適切な排出量を調整すること」として考える。"}, {"id": "n25", "parent": "n23", "title": "オリンピックと人格", "type": "page", "body": "オリンピックの順位や競技結果と、人間の人格そのものは別のものとして扱う。"}, {"id": "n26", "parent": "root", "title": "ラジオ", "type": "folder"}, {"id": "n27", "parent": "n26", "title": "ざんていラジオ", "type": "page", "body": "長期継続しているstand.fmのラジオ企画。大量の過去回を無料で公開し、必要に応じてお賽銭箱形式の支援を用いる。"}, {"id": "n28", "parent": "n26", "title": "901–999回", "type": "page", "body": "ざんていラジオの回数区切り。901–999回のまとめサムネイルを強く見せる案。"}, {"id": "n29", "parent": "n26", "title": "ざんていニュースNeo", "type": "page", "body": "ざんていラジオ関連のニュース企画。"}, {"id": "n30", "parent": "n26", "title": "ジムトーク！", "type": "page", "body": "ライブ企画。「政治はジムだ」「悪のハーモニー」「言論は自由ではない」などのコーナーを含む。"}, {"id": "n31", "parent": "n26", "title": "モバター", "type": "page", "body": "2月の火曜日企画。0円で提供する案。"}, {"id": "n32", "parent": "n26", "title": "ざんていラジオミュージック", "type": "page", "body": "音楽関連企画。「どっちが好き？」などのタイトル・ロゴを使用。"}, {"id": "n33", "parent": "n26", "title": "ながら収録・配信・視聴", "type": "page", "body": "家事などをしながら、収録・配信・視聴を同時に行うイメージ。"}, {"id": "n34", "parent": "n26", "title": "サムネイル", "type": "page", "body": "正方形、白っぽい背景、シンプル、やりすぎないデザインを基本とする。"}, {"id": "n35", "parent": "root", "title": "キャラクター・画像", "type": "folder"}, {"id": "n36", "parent": "n35", "title": "ぺん銀＆もっ金", "type": "page", "body": "繰り返し登場するキャラクター。ペンギンと黒猫を中心に、ラジオや思想テーマを視覚化する。"}, {"id": "n37", "parent": "n35", "title": "いつもの黒猫", "type": "page", "body": "無表情・驚き・理解した顔など、場面に応じた表情で登場する黒猫キャラクター。"}, {"id": "n38", "parent": "n35", "title": "オノマトペ", "type": "page", "body": "ギュー、ばーん、バラバラバラバラ、ばいーん、うおお、がちんがちーん、あちちちち、ぴゅーー、あわあわあわ、ぬるっ、じわっ、ドドドドド、テクテク、パクパクなどをキャラクターで表現。"}, {"id": "n39", "parent": "n35", "title": "パトス", "type": "page", "body": "液体の量を測る実験という設定。パトスという液体を光り輝くオレンジ色で表現。"}, {"id": "n40", "parent": "n35", "title": "ほとばしる熱いパトス", "type": "page", "body": "熱くほとばしるパトスをキャラクターで表現。"}, {"id": "n41", "parent": "n35", "title": "ω0（オメガゼロ）", "type": "page", "body": "ωの右下に小さな0を置き、ふりがな「オメガゼロ」。壮大だが派手すぎない背景と、さりげない泡。"}, {"id": "n42", "parent": "n35", "title": "ずっとびっくりしていたい", "type": "page", "body": "ずっと驚き続けた結果、真顔になってしまうような表情表現。"}, {"id": "n43", "parent": "n35", "title": "順番？", "type": "page", "body": "「順番？」という文字を縦書きで背景に配置するデザイン。"}, {"id": "n44", "parent": "n35", "title": "推論サムネ", "type": "page", "body": "既存キャラクター画像をそのまま使い、「推論」をテーマにしたサムネイル。"}, {"id": "n45", "parent": "n35", "title": "OOOサムネ", "type": "page", "body": "オブジェクト指向存在論。ObjectOrientedOntologyの注釈や、オブジェクトがオブジェクトを食べる図。ドーナツを便宜的に使用。"}, {"id": "n46", "parent": "n35", "title": "サッカーフェイント漫画", "type": "page", "body": "2コマ、言葉を使わずオノマトペだけでフェイントを表現。黒猫が「理解した ( ˘ω˘)」という顔で登場。"}, {"id": "n47", "parent": "n35", "title": "ペンギンの高速バレエ", "type": "page", "body": "ペンギンが男性版バレエ衣装で高速回転し、黒猫が呆れて見る。"}, {"id": "n48", "parent": "n35", "title": "格闘ゲーム", "type": "page", "body": "ペンギンと黒猫をゲームセンターの格闘ゲームに登場させる。"}, {"id": "n49", "parent": "n35", "title": "グリーンバック", "type": "page", "body": "猫・ペンギン・ソファだけを残し、背景をグリーンバックにする。"}, {"id": "n50", "parent": "n35", "title": "漁網から逃げる魚", "type": "page", "body": "魚がクモの巣ではなく、漁に使う網から逃げているドット絵。"}, {"id": "n51", "parent": "n35", "title": "500mLのお茶", "type": "page", "body": "500mLのお茶のペットボトル。カロリー表示などを正確にし、光の反射で文字が見えにくいリアルな表現。"}, {"id": "n52", "parent": "root", "title": "アニメ・SF", "type": "folder"}, {"id": "n53", "parent": "n52", "title": "機動戦士ガンダム", "type": "page", "body": "初代ガンダム終盤を「子どもでいられる場所」として読む視点。"}, {"id": "n54", "parent": "n52", "title": "クスィーとAE", "type": "page", "body": "クスィー、アナハイム・エレクトロニクス、サナリーなどの関係を考える。"}, {"id": "n55", "parent": "n52", "title": "MUSEとAI", "type": "page", "body": "MetaのMUSEやInstagramとの組み合わせがAI環境をどう変えるかという話題。"}, {"id": "n56", "parent": "n52", "title": "攻殻機動隊 SAC", "type": "page", "body": "SACのエピソードやタチコマ、草薙素子などを題材に考える。著作権を考慮してオリジナルキャラクターへの置換も行う。"}, {"id": "n57", "parent": "n52", "title": "マトリックスと攻殻機動隊", "type": "page", "body": "両作品の年代・世界観・影響関係を比較する。"}, {"id": "n58", "parent": "n52", "title": "The Mind Is Flat", "type": "page", "body": "心や自己について、深層に固定された本質を想定することへの疑問と関連して考える。"}, {"id": "n59", "parent": "n52", "title": "モナドと量子", "type": "page", "body": "ライプニッツのモナドと量子的な見方の類似・相違を考える。"}, {"id": "n60", "parent": "root", "title": "本・読書", "type": "folder"}, {"id": "n61", "parent": "n60", "title": "コーラスライン", "type": "page", "body": "『コーラスライン』のあらすじとキャシーの位置づけを検討。「目的と手段は曖昧」という感想につながった。"}, {"id": "n62", "parent": "n60", "title": "読んだことのなさそうな本", "type": "page", "body": "ユーザーがまだ読んでいなさそうな本を優先して推薦する。"}, {"id": "n63", "parent": "root", "title": "アプリ・技術", "type": "folder"}, {"id": "n64", "parent": "n63", "title": "超軽量メモアプリ", "type": "page", "body": "Swift + Swift PlaygroundsでiPad向けの非常に軽いローカルメモアプリを作る。日々の考えを整理する。"}, {"id": "n65", "parent": "n63", "title": "ドラッグ＆ドロップ分類", "type": "page", "body": "メモを指でドラッグしてフォルダへ分類する機能。"}, {"id": "n66", "parent": "n63", "title": "iPadのコピー＆ペースト", "type": "page", "body": "SwiftでiPadのコピー＆ペーストを実装する際の仕組みを検討。"}, {"id": "n67", "parent": "n63", "title": "HTML自分用Wiki", "type": "page", "body": "ChatGPTとの会話や自分の考えを、階層構造で整理する個人Wiki。HTML一枚で試作し、編集・追加・削除・検索を行う。"}, {"id": "n68", "parent": "root", "title": "旅行", "type": "folder"}, {"id": "n69", "parent": "n68", "title": "宮古島旅行 11月", "type": "page", "body": "11月の宮古島旅行を計画。新千歳→東京→宮古島→東京→新千歳の分割旅程を検討。"}, {"id": "n70", "parent": "n68", "title": "宮古島 3泊", "type": "page", "body": "宮古島3泊を中心に、前後に東京1泊を入れる旅程を検討。"}, {"id": "n71", "parent": "n68", "title": "宮古島・ユニビーチ周辺", "type": "page", "body": "ユニビーチ周辺でカヌーやライフジャケットのみのレンタルについて検討。"}, {"id": "n72", "parent": "n68", "title": "石垣島", "type": "page", "body": "石垣島の3泊旅行について、オフシーズンの時期を検討。"}, {"id": "n73", "parent": "n68", "title": "広島・宮古島 / 新千歳・宮古島", "type": "page", "body": "広島や新千歳から宮古島へ行く場合の航空券や時期を比較。"}, {"id": "n74", "parent": "root", "title": "言葉・表現", "type": "folder"}, {"id": "n75", "parent": "n74", "title": "普通", "type": "page", "body": "「普通」という言葉をキャラクターやタイトルの中で扱う。"}, {"id": "n76", "parent": "n74", "title": "嘘 → 格", "type": "page", "body": "「嘘」から「格」へ。人格・品格・格納庫など、「格」という言葉の広がりをテーマにする。"}, {"id": "n77", "parent": "n74", "title": "あわい", "type": "page", "body": "二つのものの間・境界のような曖昧な領域を表す言葉。"}, {"id": "n78", "parent": "n74", "title": "ウンカー / おまおっぱ / それはそう", "type": "page", "body": "LINEスタンプ等で使う短い言葉・リアクション表現。"}, {"id": "n79", "parent": "root", "title": "プロフィール", "type": "folder"}, {"id": "n80", "parent": "n79", "title": "スポーツと性格", "type": "page", "body": "小学生の野球・剣道、高校で剣道2段、大学で競技アルペンスキー。個人競技・スピード・北海道や海外へのアクセスなどがスキーを選んだ理由。"}, {"id": "n81", "parent": "n79", "title": "社労士", "type": "page", "body": "社会保険労務士としての仕事。労働契約、社会保険、ハラスメント、マイナンバーなどを扱う。"}, {"id": "n82", "parent": "n79", "title": "会話スタイル", "type": "page", "body": "日本語中心。具体例を好み、曖昧な説明は避けたい。講義型よりも問いを返すソクラテス的な会話を好む。"}];
const KEY="jibunWikiTreeV2";
let data;
try {
  const s=localStorage.getItem(KEY); data=s?JSON.parse(s):INITIAL;
  if(!Array.isArray(data)||!data.length) data=INITIAL;
} catch(e) { data=INITIAL; }
let current="root", editing=null;

function saveAll(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function children(parent){return data.filter(x=>x.parent===parent)}
function find(id){return data.find(x=>x.id===id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function path(id) {
 let a=[], x=find(id); while(x){a.unshift(x);x=find(x.parent)} return a;
}
function render() {
 const app=document.getElementById("app");
 if(current.startsWith("search:")){renderSearch(current.slice(7));return}
 if(current==="root"){renderFolder("root","トップ");return}
 const n=find(current); if(!n){current="root";return render();}
 if(n.type==="folder") renderFolder(n.id,n.title); else renderPage(n);
}
function crumb(id) {
 const ps=id==="root"?[]:path(id);
 return '<div class="crumb"><span onclick="goRoot()">トップ</span>'+
 ps.map((x,i)=>' / <span onclick="openItem(\''+x.id+'\')">'+esc(x.title)+'</span>').join("")+'</div>';
}
function renderFolder(id,title) {
 const items=children(id);
 document.getElementById("app").innerHTML=crumb(id)+
 '<h1 class="title">'+esc(title)+'</h1>'+
 '<div class="actions">'+
 '<button onclick="openNew(\''+id+'\',\'folder\')">＋ フォルダ</button>'+
 '<button onclick="openNew(\''+id+'\',\'page\')">＋ ページ</button>'+
 (id!=="root"?'<button onclick="editCurrent()">✏️ 編集</button><button onclick="deleteCurrent()">🗑️ 削除</button>':'')+
 '</div>'+
 (items.length?'<div class="grid">'+items.map(itemCard).join("")+'</div>':'<div class="empty">まだ何もありません。＋から追加できます。</div>');
}
function itemCard(n) {
 const icon=n.type==="folder"?"📁":"📄";
 return '<div class="item" onclick="openItem(\''+n.id+'\')"><div class="icon">'+icon+'</div><div class="name">'+esc(n.title)+'</div><div class="type">'+(n.type==="folder"?"フォルダ":"ページ")+'</div></div>';
}
function renderPage(n) {
 document.getElementById("app").innerHTML=crumb(n.id)+
 '<h1 class="title">'+esc(n.title)+'</h1>'+
 '<div class="article"><p>'+esc(n.body||"")+'</p></div>'+
 '<div class="actions"><button onclick="editCurrent()">✏️ 編集</button><button onclick="deleteCurrent()">🗑️ 削除</button></div>';
}
function renderSearch(q) {
 const hits=data.filter(x=>(x.title+" "+(x.body||"")).toLowerCase().includes(q.toLowerCase()));
 document.getElementById("app").innerHTML='<div class="crumb">検索</div><h1 class="title">「'+esc(q)+'」</h1>'+
 (hits.length?'<div class="grid">'+hits.map(itemCard).join("")+'</div>':'<div class="empty">見つかりませんでした。</div>');
}
function openItem(id){current=id;render();window.scrollTo(0,0)}
function goRoot(){current="root";render()}
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim();current=q?"search:"+q:"root";render()});

function openNew(parent="root",type="page") {
 editing=null; document.getElementById("dlgTitle").textContent=type==="folder"?"フォルダを追加":"ページを追加";
 document.getElementById("fTitle").value="";document.getElementById("fType").value=type;document.getElementById("fBody").value="";
 document.getElementById("editor").dataset.parent=parent;document.getElementById("editor").showModal();
}
function editCurrent() {
 const n=find(current); if(!n)return; editing=n.id;
 document.getElementById("dlgTitle").textContent="編集";document.getElementById("fTitle").value=n.title;
 document.getElementById("fType").value=n.type;document.getElementById("fBody").value=n.body||"";
 document.getElementById("editor").dataset.parent=n.parent;document.getElementById("editor").showModal();
}
function saveItem() {
 const title=document.getElementById("fTitle").value.trim(); if(!title)return;
 const type=document.getElementById("fType").value, body=document.getElementById("fBody").value;
 if(editing) {const n=find(editing);Object.assign(n,{title,type,body});current=n.id}
 else {const id="n"+Date.now();data.push({id,parent:document.getElementById("editor").dataset.parent||"root",title,type,body});current=id}
 saveAll();editor.close();render();
}
function deleteCurrent() {
 const n=find(current);if(!n)return;
 if(!confirm("「"+n.title+"」を削除しますか？（中のページも削除されます）"))return;
 const ids=new Set([n.id]);let changed=true;while(changed){changed=false;for(const x of data)if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}}
 data=data.filter(x=>!ids.has(x.id));saveAll();current=n.parent||"root";render();
}
render();
</script></body></html>
