:root{--bg:#f6f6f4;--panel:#fff;--line:#deded9;--text:#222;--muted:#777;--accent:#333}

button,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}button:hover{background:#f0f0ed}
main{max-width:900px;margin:0 auto;padding:22px 14px 60px}.crumb{font-size:20px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.crumb span{cursor:pointer;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;min-height:46px;display:inline-flex;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}.crumb .drop-target{outline:3px dashed #777;outline-offset:2px;background:#f0f0ed}.crumb .crumb-target{transition:.12s}.crumb .crumb-target.drop-target{transform:scale(1.03)}.crumb span:hover{background:#f0f0ed}.crumb .sep{border:0;background:none;padding:0;color:var(--muted);font-weight:400}.title{font-size:30px;margin:4px 0 22px}
.folder-icon{font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}.folder-svg{width:30px;height:26px;display:block}.page-icon{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.item.dragging{opacity:.45}.item.drop-target{outline:3px dashed #777;outline-offset:3px}.drop-hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}.drag-ghost{position:fixed;z-index:9999;pointer-events:none;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0002;font-weight:700;display:none}.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:105px;cursor:pointer;transition:.15s;touch-action:none;user-select:none;-webkit-user-select:none}.item.dragging{opacity:.45}.item.drop-target{outline:3px dashed #777;outline-offset:3px}.item:hover{transform:translateY(-1px);box-shadow:0 4px 15px #0000000d}.icon{font-size:24px;margin-bottom:10px}.name{font-weight:650}.type{font-size:12px;color:var(--muted);margin-top:5px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.search{width:190px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
dialog{border:1px solid var(--line);border-radius:16px;width:min(620px,92vw);padding:0;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0005}.dlg{padding:20px}.dlg h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.field textarea{min-height:180px;resize:vertical}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

<script>
const SUPABASE_URL="https://slofvjhrlbgiqvwyxqvo.supabase.co";
const SUPABASE_KEY="sb_publishable_m7cgZnABDuFA1P0HKQG_4w_KgAXHLrh";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const INITIAL=[{"id": "n0", "parent": "root", "title": "△", "type": "folder"}, {"id": "n1", "parent": "n0", "title": "組織", "type": "page", "body": "家族・部族・国家など、人間が作る組織と、その内側／外側の関係について考える。△という形で人間の階層構造を捉える。"}, {"id": "n2", "parent": "n0", "title": "競争", "type": "page", "body": "人が「1番」を目指す構造や、競い合う心について考える。競争そのものと、そこから生まれる位置争いを切り分ける。"}, {"id": "n3", "parent": "n0", "title": "GY▽XA", "type": "page", "body": "世界平和を目指すプロジェクト。すべての組織への関心から生まれ、「焦るな」を中心的なメッセージとする。△の命令としての競い合う心、盛り上げる方向の法則、平坦化とその先の崩壊などを扱う。"}, {"id": "n4", "parent": "n0", "title": "銀リテ", "type": "page", "body": "「銀リテラシー」。どこでも金・1番を目指さなくてもよい、という考え方。「多くの銀」「2番でもよい」という発想。ただし現在はポジション争い自体への関心が薄れている。"}, {"id": "n5", "parent": "n0", "title": "競い合う心", "type": "page", "body": "競争を生む心の動き。△の構造と結びついて考えているテーマ。"}, {"id": "n6", "parent": "n0", "title": "焦るな", "type": "page", "body": "GY▽XAの中心的なメッセージ。競争や変化の中で焦らないことを扱う。"}, {"id": "n7", "parent": "root", "title": "推論", "type": "folder"}, {"id": "n8", "parent": "n7", "title": "演繹", "type": "page", "body": "演繹・帰納・アブダクションの境界について考える。演繹も広い意味では推論の一種として捉える。"}, {"id": "n9", "parent": "n7", "title": "帰納", "type": "page", "body": "個別の事例から一般化する推論。アブダクションとの違いや共通点を検討した。"}, {"id": "n10", "parent": "n7", "title": "アブダクション", "type": "page", "body": "観察された事実から、それを説明しうる仮説を推論する考え方。科学的思考との関係を検討した。"}, {"id": "n11", "parent": "n7", "title": "言葉の曖昧さ", "type": "page", "body": "言葉は意味が固定されているようで、文脈によってフレームが変わる。言葉の定義そのものを問い直すテーマ。"}, {"id": "n12", "parent": "n7", "title": "アブダクション英語独習法", "type": "page", "body": "今井むつみ『アブダクション英語独習法』について検討した。英語学習における推論の扱いに関心がある。"}, {"id": "n13", "parent": "root", "title": "人格", "type": "folder"}, {"id": "n14", "parent": "n13", "title": "人格弱体化", "type": "page", "body": "人間を人格という単位で評価・序列化することへの疑問。行為の評価と人格そのものへの評価を分けて考える。"}, {"id": "n15", "parent": "n13", "title": "行為と人格", "type": "page", "body": "「人を尊重する」と「行為を尊重する」を区別する。法律や道徳の判断が人格評価へ飛躍することについて考える。"}, {"id": "n16", "parent": "n13", "title": "らしさが無い", "type": "page", "body": "自分には固定された本質や「らしさ」がない、という捉え方。分人主義とも関連する。"}, {"id": "n17", "parent": "n13", "title": "オートロジー", "type": "page", "body": "自己言及・自己記述に関わる考え方。自分自身について語ることの構造を考える。"}, {"id": "n18", "parent": "n13", "title": "オントロジー", "type": "page", "body": "存在についての捉え方。オートロジーとの対比から考える。"}, {"id": "n19", "parent": "root", "title": "自由", "type": "folder"}, {"id": "n20", "parent": "n19", "title": "自由という推論", "type": "page", "body": "自由そのものも、実体として存在するというより、人間が推論によって組み立てている可能性がある。教育の根本原則として自由を置くことへの疑問にもつながる。"}, {"id": "n21", "parent": "n19", "title": "自分ごとと世界ごと", "type": "page", "body": "「自分ごと」と「世界ごと」を混ぜることで、問題のフレームが変わってしまうことへの注意。"}, {"id": "n22", "parent": "n19", "title": "教育と推論", "type": "page", "body": "自由や学習を教育の前提にするのではなく、それ自体が推論の産物なのではないか、という問い。"}, {"id": "n23", "parent": "root", "title": "ドーパミン", "type": "folder"}, {"id": "n24", "parent": "n23", "title": "適切な排出量", "type": "page", "body": "最近の中心的な捉え方。オリンピックや人格とは切り離して、目的を「ドーパミンの適切な排出量を調整すること」として考える。"}, {"id": "n25", "parent": "n23", "title": "オリンピックと人格", "type": "page", "body": "オリンピックの順位や競技結果と、人間の人格そのものは別のものとして扱う。"}, {"id": "n26", "parent": "root", "title": "ラジオ", "type": "folder"}, {"id": "n27", "parent": "n26", "title": "ざんていラジオ", "type": "page", "body": "長期継続しているstand.fmのラジオ企画。大量の過去回を無料で公開し、必要に応じてお賽銭箱形式の支援を用いる。"}, {"id": "n28", "parent": "n26", "title": "901–999回", "type": "page", "body": "ざんていラジオの回数区切り。901–999回のまとめサムネイルを強く見せる案。"}, {"id": "n29", "parent": "n26", "title": "ざんていニュースNeo", "type": "page", "body": "ざんていラジオ関連のニュース企画。"}, {"id": "n30", "parent": "n26", "title": "ジムトーク！", "type": "page", "body": "ライブ企画。「政治はジムだ」「悪のハーモニー」「言論は自由ではない」などのコーナーを含む。"}, {"id": "n31", "parent": "n26", "title": "モバター", "type": "page", "body": "2月の火曜日企画。0円で提供する案。"}, {"id": "n32", "parent": "n26", "title": "ざんていラジオミュージック", "type": "page", "body": "音楽関連企画。「どっちが好き？」などのタイトル・ロゴを使用。"}, {"id": "n33", "parent": "n26", "title": "ながら収録・配信・視聴", "type": "page", "body": "家事などをしながら、収録・配信・視聴を同時に行うイメージ。"}, {"id": "n34", "parent": "n26", "title": "サムネイル", "type": "page", "body": "正方形、白っぽい背景、シンプル、やりすぎないデザインを基本とする。"}, {"id": "n35", "parent": "root", "title": "キャラクター・画像", "type": "folder"}, {"id": "n36", "parent": "n35", "title": "ぺん銀＆もっ金", "type": "page", "body": "繰り返し登場するキャラクター。ペンギンと黒猫を中心に、ラジオや思想テーマを視覚化する。"}, {"id": "n37", "parent": "n35", "title": "いつもの黒猫", "type": "page", "body": "無表情・驚き・理解した顔など、場面に応じた表情で登場する黒猫キャラクター。"}, {"id": "n38", "parent": "n35", "title": "オノマトペ", "type": "page", "body": "ギュー、ばーん、バラバラバラバラ、ばいーん、うおお、がちんがちーん、あちちちち、ぴゅーー、あわあわあわ、ぬるっ、じわっ、ドドドドド、テクテク、パクパクなどをキャラクターで表現。"}, {"id": "n39", "parent": "n35", "title": "パトス", "type": "page", "body": "液体の量を測る実験という設定。パトスという液体を光り輝くオレンジ色で表現。"}, {"id": "n40", "parent": "n35", "title": "ほとばしる熱いパトス", "type": "page", "body": "熱くほとばしるパトスをキャラクターで表現。"}, {"id": "n41", "parent": "n35", "title": "ω0（オメガゼロ）", "type": "page", "body": "ωの右下に小さな0を置き、ふりがな「オメガゼロ」。壮大だが派手すぎない背景と、さりげない泡。"}, {"id": "n42", "parent": "n35", "title": "ずっとびっくりしていたい", "type": "page", "body": "ずっと驚き続けた結果、真顔になってしまうような表情表現。"}, {"id": "n43", "parent": "n35", "title": "順番？", "type": "page", "body": "「順番？」という文字を縦書きで背景に配置するデザイン。"}, {"id": "n44", "parent": "n35", "title": "推論サムネ", "type": "page", "body": "既存キャラクター画像をそのまま使い、「推論」をテーマにしたサムネイル。"}, {"id": "n45", "parent": "n35", "title": "OOOサムネ", "type": "page", "body": "オブジェクト指向存在論。ObjectOrientedOntologyの注釈や、オブジェクトがオブジェクトを食べる図。ドーナツを便宜的に使用。"}, {"id": "n46", "parent": "n35", "title": "サッカーフェイント漫画", "type": "page", "body": "2コマ、言葉を使わずオノマトペだけでフェイントを表現。黒猫が「理解した ( ˘ω˘)」という顔で登場。"}, {"id": "n47", "parent": "n35", "title": "ペンギンの高速バレエ", "type": "page", "body": "ペンギンが男性版バレエ衣装で高速回転し、黒猫が呆れて見る。"}, {"id": "n48", "parent": "n35", "title": "格闘ゲーム", "type": "page", "body": "ペンギンと黒猫をゲームセンターの格闘ゲームに登場させる。"}, {"id": "n49", "parent": "n35", "title": "グリーンバック", "type": "page", "body": "猫・ペンギン・ソファだけを残し、背景をグリーンバックにする。"}, {"id": "n50", "parent": "n35", "title": "漁網から逃げる魚", "type": "page", "body": "魚がクモの巣ではなく、漁に使う網から逃げているドット絵。"}, {"id": "n51", "parent": "n35", "title": "500mLのお茶", "type": "page", "body": "500mLのお茶のペットボトル。カロリー表示などを正確にし、光の反射で文字が見えにくいリアルな表現。"}, {"id": "n52 let data=[], current="root", editing=null, user=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function children(parent){return data.filter(x=>x.parent===parent).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.title.localeCompare(b.title,'ja'))}
function find(id){return data.find(x=>x.id===id)}
function path(id){let a=[],x=find(id);while(x){a.unshift(x);x=find(x.parent)}return a}
function setStatus(msg){$('status').textContent=msg||''}
async function boot(){
  user=null;
  const cached=localStorage.getItem('jibunWikiTreeV2');
  if(cached){try{data=JSON.parse(cached)}catch(e){data=[]}}
  if(!data.length)data=INITIAL.map((x,i)=>({...x,sort_order:i}));

  await loadCloud();
  render();
}
async function loadCloud(){
  setStatus('☁️ 読み込み中…');
  try{
    const {data:rows,error}=await sb.from('wiki_pages').select('*').order('sort_order',{ascending:true});
    if(error){setStatus('☁️ 接続エラー');return}
    if(!rows.length){await seedInitial();return}
    data=rows.map(r=>({id:r.id,parent:r.parent_id||'root',title:r.title,type:r.kind,body:r.content||'',sort_order:r.sort_order||0}));
    localStorage.setItem('jibunWikiTreeV2',JSON.stringify(data));setStatus('☁️ クラウド保存中');
  }catch(e){setStatus('☁️ 接続エラー')}
}
async function seedInitial(){
  setStatus('最初のWikiをクラウドへ移しています…');
  const idMap={root:'root'};
  data=INITIAL.map((x,i)=>({...x,sort_order:i}));
  // Keep stable client IDs by mapping to UUIDs.
  const rows=[];
  for(const x of data){const newId=crypto.randomUUID();idMap[x.id]=newId;rows.push({id:newId,parent_id:x.parent==='root'?null:idMap[x.parent],title:x.title,content:x.body||'',kind:x.type,sort_order:x.sort_order,owner_id:null});}
  const {error}=await sb.from('wiki_pages').insert(rows);
  if(error){setStatus('初期データ移行エラー: '+error.message);return}
  data=rows.map(r=>({id:r.id,parent:r.parent_id||'root',title:r.title,type:r.kind,body:r.content||'',sort_order:r.sort_order}));
  localStorage.setItem('jibunWikiTreeV2',JSON.stringify(data));setStatus('☁️ クラウド保存完了');
}
function crumb(id){const ps=id==='root'?[]:path(id);return `<div class="crumb"><span class="crumb-target" data-id="root" data-drop-id="root" onclick="goRoot()" onpointerdown="pointerDown(event,'root')" onpointermove="pointerMove(event)" onpointerup="pointerUp(event)" onpointercancel="pointerCancel(event)">トップ</span>${ps.map(x=>`<span class="sep">›</span><span class="crumb-target" data-id="${x.id}" data-drop-id="${x.id}" onclick="openItem('${x.id}')" onpointerdown="pointerDown(event,'${x.id}')" onpointermove="pointerMove(event)" onpointerup="pointerUp(event)" onpointercancel="pointerCancel(event)">${esc(x.title)}</span>`).join('')}</div>`}
function render(){if(current.startsWith('search:'))return renderSearch(current.slice(7));if(current==='root')return renderFolder('root','トップ');const n=find(current);if(!n){current='root';return render()}n.type==='folder'?renderFolder(n.id,n.title):renderPage(n)}
function renderFolder(id,title){const items=children(id);const extra=id!=='root'?'<button onclick="editCurrent()">✏️ 編集</button><button onclick="deleteCurrent()">🗑️ 削除</button>':'';const body=items.length?'<div class="drop-hint">↪ 移動モード：フォルダまたは上のパスへドロップ　／　↕ 並べ替えモード：同じ階層で順番変更</div><div class="grid" ondragover="allowDrop(event)" ondrop="dropOnFolder(event,\''+id+'\')">'+items.map(itemCard).join('')+'</div>':'<div class="empty">まだ何もありません。＋から追加できます。</div>';$('app').innerHTML=crumb(id)+'<h1 class="title">'+esc(title)+'</h1><div class="actions"><button onclick="openNew(\''+id+'\',\'folder\')">＋ フォルダ</button><button onclick="openNew(\''+id+'\',\'page\')">＋ ページ</button>'+extra+'</div>'+body}
function itemCard(n){return `<div class="item" data-id="${n.id}" onclick="handleTap(event,'${n.id}')" onpointerdown="pointerDown(event,'${n.id}')" onpointermove="pointerMove(event)" onpointerup="pointerUp(event)" onpointercancel="pointerCancel(event)"><div class="icon ${n.type==='folder'?'folder-icon':'page-icon'}">${n.type==='folder'?'<svg class="folder-svg" viewBox="0 0 64 52" aria-label="フォルダ"><path d="M4 10c0-3 2-5 5-5h17l6 7h23c3 0 5 2 5 5v26c0 4-3 7-7 7H11c-4 0-7-3-7-7V10z" fill="#b7df9d"/><path d="M4 16h56v27c0 4-3 7-7 7H11c-4 0-7-3-7-7V16z" fill="#9dcc7f"/><path d="M9 9h17l5 6H9z" fill="#cbeab6"/></svg>':'<svg class="file-svg" viewBox="0 0 48 56" aria-label="ファイル"><path d="M7 2h24l10 10v38c0 2-2 4-4 4H7c-2 0-4-2-4-4V6c0-2 2-4 4-4z" fill="#d5d8dc"/><path d="M31 2v10h10" fill="#eceeef"/><path d="M10 27h28M10 34h28M10 41h20" stroke="#a9adb2" stroke-width="3" stroke-linecap="round"/></svg>'}</div><div class="name">${esc(n.title)}</div></div>`}
function renderPage(n){$('app').innerHTML=`${crumb(n.id)}<h1 class="title">${esc(n.title)}</h1><div class="article"><p>${esc(n.body||'')}</p></div><div class="actions"><button onclick="editCurrent()">✏️ 編集</button><button onclick="deleteCurrent()">🗑️ 削除</button></div>`}

function pointerDown(e,id){if(e.pointerType==='mouse'&&e.button!==0)return;pointerDrag={id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,el:e.currentTarget};try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
function getDropTarget(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el)return null;
  const crumbTarget=el.closest('.crumb-target');
  if(crumbTarget)return {el:crumbTarget,id:crumbTarget.dataset.dropId||crumbTarget.dataset.id,type:'crumb'};
  const item=el.closest('.item[data-id]');
  if(item)return {el:item,id:item.dataset.id,type:'item'};
  return null;
}
function isValidDropTarget(t){
  if(!t||!draggedId||t.id===draggedId)return false;
  const source=find(draggedId);
  if(!source)return false;
  if(dragMode==='sort'){
    const target=find(t.id);
    return t.type==='item' && !!target && source.parent===target.parent;
  }
  if(t.type==='crumb'){
    return t.id==='root' || (!!find(t.id) && find(t.id).type==='folder');
  }
  const target=find(t.id);
  if(!target || target.type!=='folder')return false;
  if(source.type==='folder' && isDescendant(target.id,source.id))return false;
  return true;
}

  if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;
  const dx=e.clientX-pointerDrag.startX,dy=e.clientY-pointerDrag.startY;
  if(!pointerDrag.moved&&Math.hypot(dx,dy)<10)return;
  if(!pointerDrag.moved){
    pointerDrag.moved=true;draggedId=pointerDrag.id;pointerDrag.el.classList.add('dragging');
    const n=find(draggedId),g=$('dragGhost');g.textContent=(n?.type==='folder'?'📁 ':'📄 ')+(n?.title||'');g.style.display='block';
  }
  const g=$('dragGhost');g.style.left=(e.clientX+12)+'px';g.style.top=(e.clientY+12)+'px';
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  const t=getDropTarget(e.clientX,e.clientY);
  if(isValidDropTarget(t))t.el.classList.add('drop-target');
  e.preventDefault();
}
async function pointerUp(e){
  if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;
  const s=pointerDrag;pointerDrag=null;$('dragGhost').style.display='none';s.el.classList.remove('dragging');
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  if(!s.moved)return;
  window.justDropped=true;
  const t=getDropTarget(e.clientX,e.clientY);
  if(isValidDropTarget(t)){
    if(dragMode==='move') await dropToParent(s.id,t.id);
    else await dropItemTouch(s.id,t.id);
  }
  setTimeout(()=>window.justDropped=false,120);
}
function pointerCancel(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;pointerDrag.el.classList.remove('dragging');pointerDrag=null;$('dragGhost').style.display='none';document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))}
async function dropItemTouch(sourceId,targetId){const source=find(sourceId),target=find(targetId);if(!source||!target||source.id===target.id)return;if(dragMode!=='sort')return;if(source.parent!==target.parent)return;const newParent=target.parent;const siblings=children(newParent).filter(x=>x.id!==source.id);let idx=siblings.findIndex(x=>x.id===target.id);if(idx<0)return;siblings.splice(idx,0,source);await persistOrder(source,newParent,siblings)}
async function dropToParent(sourceId,parentId){const source=find(sourceId);if(!source||source.id===parentId)return;if(source.type==='folder'&&parentId!=='root'&&isDescendant(parentId,source.id))return;const siblings=children(parentId).filter(x=>x.id!==source.id);siblings.push(source);await persistOrder(source,parentId,siblings)}
function isDescendant(id,ancestor){let x=find(id);while(x){if(x.parent===ancestor)return true;x=find(x.parent)}return false}
async function persistOrder(source,newParent,siblings){const oldParent=source.parent;source.parent=newParent;const results=await Promise.all(siblings.map((x,i)=>{x.sort_order=i;return sb.from('wiki_pages').update({parent_id:newParent==='root'?null:newParent,sort_order:i}).eq('id',x.id)}));const bad=results.find(r=>r.error);if(bad){alert(bad.error.message);source.parent=oldParent;return}localStorage.setItem('jibunWikiTreeV2',JSON.stringify(data));setStatus('☁️ 保存しました');render()}
function dragStart(e,id){draggedId=id;window.justDropped=false;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));setTimeout(()=>window.justDropped=false,80)}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('drop-target')}
async function dropItem(e,targetId){e.preventDefault();window.justDropped=true;const id=draggedId||e.dataTransfer.getData('text/plain');if(dragMode==='sort'){const source=find(id),target=find(targetId);if(source&&target&&source.parent===target.parent)await dropItemTouch(id,targetId)}else{const target=find(targetId);if(target?.type==='folder')await dropToParent(id,targetId)}document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))}
async function dropOnFolder(e,parentId){e.preventDefault();window.justDropped=true;if(dragMode==='move')await dropToParent(draggedId||e.dataTransfer.getData('text/plain'),parentId);document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))}

async function saveItem(){const title=$('fTitle').value.trim();if(!title)return;const type=$('fType').value,body=$('fBody').value;
  if(editing){const n=find(editing);const {error}=await sb.from('wiki_pages').update({title,kind:type,content:body}).eq('id',n.id);if(error){alert(error.message);return}Object.assign(n,{title,type,body});current=n.id}
  else{const id=crypto.randomUUID();const parent=$('editor').dataset.parent||'root';const order=children(parent).length;const row={id,parent_id:parent==='root'?null:parent,title,kind:type,content:body,sort_order:order,owner_id:null};const {error}=await sb.from('wiki_pages').insert(row);if(error){alert(error.message);return}data.push({id,parent,title,type,body,sort_order:order});current=id}
  localStorage.setItem('jibunWikiTreeV2',JSON.stringify(data));$('editor').close();setStatus('☁️ 保存しました');render();
}
async function deleteCurrent(){const n=find(current);if(!n)return;if(!confirm('「'+n.title+'」を削除しますか？（中のページも削除されます）'))return;const ids=new Set([n.id]);let changed=true;while(changed){changed=false;for(const x of data)if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}}const {error}=await sb.from('wiki_pages').delete().in('id',[...ids]);if(error){alert(error.message);return}data=data.filter(x=>!ids.has(x.id));localStorage.setItem('jibunWikiTreeV2',JSON.stringify(data));current=n.parent||'root';setStatus('☁️ 削除しました');render()}
boot();
setTimeout(updateDropHint,0);
</script></body></html>
