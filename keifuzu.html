<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌳 系譜図ガーデン</title>
<style>
  :root{
    --bg:#edf0f2; --card:#ffffff; --ink:#20242c; --sub:#8b93a1;
    --line:#e2e6eb; --green:#4caf50; --accent:#4da866; --accent2:#2f7d4f;
    --brown:#a26744; --danger:#c0452f; --gold:#e9c46a;
    --shadow:0 1px 2px rgba(32,36,44,.05), 0 10px 30px rgba(32,36,44,.07);
    --shadow-sm:0 1px 2px rgba(32,36,44,.05), 0 4px 12px rgba(32,36,44,.06);
    --grad:linear-gradient(135deg,#5cb877,#35935e);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#f7f8f9 0%, var(--bg) 260px);
    color:var(--ink); font-size:15px; line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; cursor:pointer;}
  input,select,textarea{font:inherit; color:var(--ink);}
  input:focus, textarea:focus, select:focus{outline:2px solid rgba(77,168,102,.45); outline-offset:0;}
  input[type=checkbox]{accent-color:var(--accent);}
  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.85); backdrop-filter:blur(12px) saturate(1.4);
    border-bottom:1px solid rgba(32,36,44,.06);
    padding:10px 12px 10px;
  }
  .h-title{font-size:19px; font-weight:800; letter-spacing:.01em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .h-title .count{font-size:12px; color:var(--sub); font-weight:500;}
  .h-stock{display:flex; gap:10px; font-size:13px; margin-top:4px; color:var(--sub); flex-wrap:wrap;}
  .h-stock b{font-variant-numeric:tabular-nums; color:var(--ink);}
  .h-btns{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .hbtn{
    border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:6px 13px; font-size:13px; box-shadow:var(--shadow-sm);
  }
  .hbtn.primary{background:var(--grad); border:none; color:#fff; font-weight:700; box-shadow:0 4px 14px rgba(53,147,94,.35);}
  .hbtn.reload{
    background:var(--grad); color:#fff; border:none;
    display:inline-flex; align-items:center; gap:6px; font-weight:700;
    box-shadow:0 4px 14px rgba(53,147,94,.35);
  }
  .hbtn.reload svg{width:15px; height:15px;}
  .hbtn.reload.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hbtn:active{transform:scale(.97);}
  /* ---------- banner ---------- */
  #banner{
    display:none; margin:10px 12px 0; padding:9px 12px; border-radius:12px;
    background:#fff7e8; border:1px solid #f0d9a8; color:#7a5510; font-size:13.5px;
  }
  #banner.error{background:#fdecea; border-color:#f0beb4; color:#8c2f1d;}
  #banner.show{display:block;}
  /* ---------- layout ---------- */
  #layout{display:block;}
  #treePane{padding:12px 10px 30px;}
  @media (min-width:900px){
    #layout{display:flex; align-items:flex-start; gap:14px; max-width:1200px; margin:0 auto;}
    #treePane{flex:1 1 auto; min-width:0;}
    #detailPane{
      flex:0 0 380px; position:sticky; top:118px; max-height:calc(100vh - 130px);
      overflow-y:auto; padding:12px 10px 30px 0;
    }
    #detailPane .sheet{
      position:static !important; transform:none !important; border-radius:20px !important;
      max-height:none !important; box-shadow:var(--shadow);
    }
    #scrim{display:none !important;}
  }
  .hint{font-size:12.5px; color:var(--sub); padding:2px 6px 10px;}
  .hint .lg{display:inline-block; width:9px; height:9px; border-radius:2px 5px 2px 5px; vertical-align:-1px; margin:0 1px 0 4px;}
  /* ---------- tree (branch layout: roots left, descendants right) ---------- */
  #tree{
    overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    border:1px solid rgba(32,36,44,.05); border-radius:18px;
    background:
      radial-gradient(circle, #dde2e8 1px, transparent 1.3px) 0 0/22px 22px,
      #fbfcfd;
    box-shadow:var(--shadow-sm);
    max-height:68vh;
  }
  .canvas{position:relative;}
  .canvas svg{position:absolute; left:0; top:0; pointer-events:none;}
  .canvas svg path{fill:none; stroke:rgba(84,110,84,.38); stroke-width:2; stroke-linecap:round;}
  .node{
    position:absolute; width:160px; height:38px;
    display:flex; flex-direction:column; justify-content:center; gap:1px;
    background:var(--card); border:1px solid rgba(32,36,44,.05); border-radius:14px;
    padding:5px 11px; box-shadow:var(--shadow-sm);
    cursor:pointer; user-select:none;
  }
  .node:active{transform:scale(.98);}
  .node.sel{outline:2px solid var(--accent); outline-offset:-1px;}
  .node .n1{display:flex; align-items:center; gap:6px; min-width:0;}
  .node .leaf{
    position:absolute; top:-6px; right:9px; z-index:2;
    width:13px; height:13px; border-radius:2px 11px 2px 11px;
    transform:rotate(-28deg);
    box-shadow:0 1px 3px rgba(32,36,44,.28);
  }
  .node .syr{position:absolute; top:-15px; left:3px; width:24px; height:24px; z-index:3; pointer-events:none;}
  .node .nm{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .node .bdg{font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .empty{padding:26px 14px; text-align:center; color:var(--sub); font-size:14px;}
  /* ---------- sheet / detail ---------- */
  #scrim{
    display:none; position:fixed; inset:0; background:rgba(28,32,38,.42); z-index:40;
    backdrop-filter:blur(2px);
  }
  #scrim.show{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--card); border-radius:22px 22px 0 0;
    max-height:86vh; overflow-y:auto; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .28s cubic-bezier(.32,.72,.24,1);
    box-shadow:0 -10px 34px rgba(32,36,44,.22);
  }
  .sheet::before{
    content:""; display:block; width:38px; height:4px; border-radius:99px;
    background:#d9dee4; margin:0 auto 12px;
  }
  .sheet.show{transform:translateY(0);}
  .sheet h2{margin:0 34px 6px 0; font-size:19px; font-weight:800;}
  .x{
    position:absolute; top:12px; right:12px; border:none; background:#eef1f4; color:var(--ink);
    width:30px; height:30px; border-radius:50%; font-size:15px; line-height:1;
  }
  .meta{font-size:13px; color:var(--ink);}
  .meta .row{display:flex; gap:8px; padding:4px 0; border-bottom:1px solid #eef1f4;}
  .meta .k{flex:0 0 92px; color:var(--sub);}
  .memo{
    white-space:pre-wrap; word-break:break-word; background:#f3f7f3;
    border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin:10px 0; font-size:14px;
  }
  .bar{height:9px; border-radius:99px; background:#e7ebee; overflow:hidden; margin:6px 0 2px;}
  .bar > div{height:100%; border-radius:99px;}
  .barlabel{font-size:12px; color:var(--sub);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px;}
  .chip{
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:4px 11px; font-size:13px; box-shadow:var(--shadow-sm);
  }
  .chip:active{transform:scale(.96);}
  .seclabel{font-size:12px; color:var(--sub); margin-top:10px;}
  .acts{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .abtn{
    border:1px solid var(--line); background:#fff; border-radius:14px;
    padding:11px 12px; font-size:15px; text-align:center; box-shadow:var(--shadow-sm);
  }
  .abtn.green{background:var(--grad); color:#fff; border:none; font-weight:700; box-shadow:0 4px 14px rgba(53,147,94,.3);}
  .abtn.danger{background:#fdf1ee; border-color:#efc4ba; color:var(--danger);}
  .abtn:disabled{opacity:.42; box-shadow:none;}
  .abtn:active{transform:scale(.98);}
  .acts .row{display:flex; gap:8px;}
  .acts .row .abtn{flex:1 1 0;}
  .acts .row .abtn.compact{font-size:13px; padding:10px 4px; white-space:nowrap;}
  .acts .row .abtn.arrow{
    flex:0 0 46px; padding:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#eef7e4,#d8edbF); border-color:#a9c98d;
  }
  .abtn.arrow svg{width:20px; height:20px; fill:none; stroke:#2f7d4f; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
  .acts .row .abtn.del{
    flex:0 0 46px; padding:0; display:flex; align-items:center; justify-content:center;
    background:#fdf1ee; border-color:#efc4ba; font-size:16px;
  }
  .sibpos{font-size:11px; color:var(--sub); text-align:right; margin-top:-3px;}
  /* ---------- forms ---------- */
  form .frow{margin:10px 0;}
  form label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:4px;}
  form input[type=text], form textarea, form select{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:9px 10px;
    background:#fff; font-size:15px;
  }
  form textarea{min-height:74px; resize:vertical;}
  .parentlist{
    max-height:170px; overflow-y:auto; border:1px solid var(--line); border-radius:12px;
    background:#fff; padding:6px 8px;
  }
  .parentlist label{
    display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink);
    padding:5px 2px; margin:0; border-bottom:1px solid #eef1f4;
  }
  .parentlist label:last-child{border-bottom:none;}
  .parentlist input{width:18px; height:18px;}
  /* ---------- list screens (trash/history) ---------- */
  .lrow{
    background:var(--card); border:1px solid rgba(32,36,44,.05); border-radius:16px;
    padding:11px 13px; margin:6px 10px; box-shadow:var(--shadow-sm); font-size:13.5px;
  }
  .lrow .t{font-weight:700; font-size:14.5px;}
  .lrow .s{color:var(--sub); font-size:12px;}
  .lrow .restore{margin-top:7px;}
  .viewhead{display:flex; align-items:center; gap:10px; padding:12px 12px 2px;}
  .viewhead .back{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:13px; box-shadow:var(--shadow-sm);}
  .viewhead h3{margin:0; font-size:16px; font-weight:800;}
  /* ---------- gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#f7f8f9,#e6eaed); padding:20px;
  }
  #gate .box{
    background:var(--card); border:1px solid rgba(32,36,44,.05); border-radius:22px;
    box-shadow:var(--shadow); padding:26px 22px; width:100%; max-width:360px; text-align:center;
  }
  #gate h1{font-size:21px; font-weight:800; margin:0 0 4px;}
  #gate p{color:var(--sub); font-size:13px; margin:0 0 14px;}
  #gate input{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px;
    font-size:16px; margin:6px 0; background:#fff; text-align:center;
  }
  #gate button{
    width:100%; margin-top:10px; background:var(--grad); color:#fff; border:none;
    border-radius:14px; padding:12px; font-size:16px; font-weight:700;
    box-shadow:0 4px 14px rgba(53,147,94,.3);
  }
  #gate .err{color:var(--danger); font-size:13px; min-height:18px; margin-top:8px;}
  footer{text-align:center; color:var(--sub); font-size:11px; padding:14px 0 20px;}
</style>
</head>
<body>

<!-- ======== gate ======== -->
<div id="gate" style="display:none">
  <div class="box">
    <h1>🌳 系譜図ガーデン</h1>
    <p>名前とパスワードで入ってね。<br>名前は変更履歴のためだけに使うよ。</p>
    <input id="gateName" type="text" placeholder="名前（例：ぺん銀）" autocomplete="off">
    <input id="gatePass" type="password" inputmode="numeric" placeholder="パスワード" autocomplete="off">
    <button id="gateBtn" type="button">入る 🌱</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<!-- ======== app ======== -->
<div id="app" style="display:none">
  <header>
    <div class="h-title">🌳 系譜図ガーデン <span class="count" id="hCount"></span></div>
    <div class="h-stock">
      <span>💊 栄養剤 × <b id="hNut">-</b></span>
      <span>☠️ 除草剤 × <b id="hHerb">-</b></span>
      <span id="hWho" style="color:var(--sub)"></span>
    </div>
    <div class="h-btns">
      <button class="hbtn primary" id="btnNew" type="button">＋ 新しい言葉</button>
      <button class="hbtn" id="btnTrash" type="button">🗑 ゴミ箱</button>
      <button class="hbtn" id="btnHistory" type="button">📜 履歴</button>
      <button class="hbtn" id="btnSearch" type="button">🔍 検索</button>
      <button class="hbtn reload" id="btnReload" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>更新</button>
    </div>
  </header>

  <div id="banner"></div>

  <main id="mainView">
    <div id="layout">
      <section id="treePane">
        <div class="hint">言葉は7日間、子が生まれないと枯れてしまう（枯れると一族も一緒に枯れる）。タップで詳細、栄養剤で元気に。<br>🍃 葉っぱの色＝何日目か：<span class="lg" style="background:hsl(130,55%,40%)"></span>1日目 <span class="lg" style="background:hsl(92,55%,42%)"></span>2日目 <span class="lg" style="background:hsl(47,90%,46%)"></span>3日目 <span class="lg" style="background:hsl(33,92%,48%)"></span>4日目 <span class="lg" style="background:hsl(8,68%,45%)"></span>5日目 <span class="lg" style="background:hsl(22,50%,33%)"></span>6日目 <span class="lg" style="background:hsl(40,5%,47%)"></span>7日目</div>
        <div id="tree"></div>
      </section>
      <aside id="detailPane"></aside>
    </div>
  </main>

  <section id="subView" style="display:none"></section>

  <footer>build <span id="buildStr"></span></footer>
</div>

<div id="scrim"></div>
<div id="sheetRoot"></div>

<script>
"use strict";
/* ================= config ================= */
const BUILD = '2026-11-13-1856';
const SB_URL = 'https://slofvjhrlbgiqvwyxqvo.supabase.co';
const SB_KEY = 'sb_publishable_m7cgZnABDuFA1P0HKQG_4w_KgAXHLrh';
const ROW_ID = '6ff100bb-7269-4959-92cb-c0bc06a3e0e6';
const DAY = 86400000;
const PASS = '2501';
const $ = (s, el) => (el || document).querySelector(s);

/* ================= state ================= */
let state = null;        // garden state JSON
let baseContent = null;  // content string as loaded (conflict check)
let myName = localStorage.getItem('keifuzu_name') || '';
let selectedId = null;
let booted = false;

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nowISO(){ return new Date().toISOString(); }
function jstToday(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return p; // YYYY-MM-DD
}
function jstDateOf(iso){
  try{
    return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
  }catch(e){ return String(iso||'').slice(0,10); }
}
function fmtDT(iso){
  if(!iso) return '—';
  try{
    return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
  }catch(e){ return String(iso).slice(0,16); }
}
function daysBetweenJST(a, b){ // a,b = 'YYYY-MM-DD'
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  const da = Date.UTC(pa[0], pa[1]-1, pa[2]), db = Date.UTC(pb[0], pb[1]-1, pb[2]);
  return Math.round((db - da) / DAY);
}
function ageDays(w){ return (Date.now() - new Date(w.vitalAt).getTime()) / DAY; }
function health(w){ return Math.max(0, 1 - ageDays(w) / 7); }
function daysLeft(w){ return Math.max(0, Math.floor(7 - ageDays(w))); }
function healthColor(h){
  // 7段階カラー（日目ごと）: 1日目 緑 → 2日目 黄緑 → 3日目 黄 → 4日目 橙 → 5日目 赤 → 6日目 茶 → 7日目 グレー
  const age = (1 - h) * 7;
  if(age < 1) return 'hsl(130,55%,40%)';
  if(age < 2) return 'hsl(92,55%,42%)';
  if(age < 3) return 'hsl(47,90%,46%)';
  if(age < 4) return 'hsl(33,92%,48%)';
  if(age < 5) return 'hsl(8,68%,45%)';
  if(age < 6) return 'hsl(22,50%,33%)';
  return 'hsl(40,5%,47%)';
}
const STATUS = {sprout:'🌱 芽', spreading:'🌿 広がり中', settled:'🌳 定着', onhold:'⏸ 保留'};
const ASPECT = {action:'行動', background:'背景', both:'両方', unset:'未設定'};
function wordById(id){ return state.words.find(w => w.id === id) || null; }
function aliveWords(){ return state.words.filter(w => !w.trashed); }
function addHistory(by, action, word, detail){
  state.history.push({at: nowISO(), by: by, action: action, word: word || '', detail: detail || ''});
}

let bannerTimer = null;
function showBanner(msg, isError){
  const b = $('#banner');
  b.textContent = msg;
  b.className = 'show' + (isError ? ' error' : '');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { b.className = ''; }, 6000);
}

/* ================= supabase ================= */
async function sbFetch(){
  const url = SB_URL + '/rest/v1/wiki_pages?id=eq.' + ROW_ID + '&select=content,updated_at';
  const res = await fetch(url, {headers:{'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY}});
  if(!res.ok) throw new Error('読込に失敗したよ（' + res.status + '）');
  const rows = await res.json();
  if(!rows.length) throw new Error('データの行が見つからないよ');
  return rows[0].content;
}
function normalize(st){
  st.version = st.version || 1;
  st.words = Array.isArray(st.words) ? st.words : [];
  st.nextId = st.nextId || (st.words.reduce((m,w)=>Math.max(m,w.id),0) + 1);
  st.stock = st.stock || {nutrient:10, herbicide:10, lastRefill:jstToday()};
  if(typeof st.stock.nutrient !== 'number') st.stock.nutrient = 10;
  if(typeof st.stock.herbicide !== 'number') st.stock.herbicide = 10;
  if(!st.stock.lastRefill) st.stock.lastRefill = jstToday();
  st.history = Array.isArray(st.history) ? st.history : [];
  st.siblingOrders = (st.siblingOrders && typeof st.siblingOrders === 'object' && !Array.isArray(st.siblingOrders)) ? st.siblingOrders : {};
  return st;
}
async function loadState(){
  const content = await sbFetch();
  baseContent = content;
  state = normalize(JSON.parse(content));
}
/* returns true if anything changed */
function autoProcess(){
  let changed = false;
  const today = jstToday();
  // 1) refill
  const elapsed = daysBetweenJST(state.stock.lastRefill, today);
  if(elapsed > 0){
    const n = Math.min(10, state.stock.nutrient + elapsed);
    const h = Math.min(10, state.stock.herbicide + elapsed);
    if(n !== state.stock.nutrient || h !== state.stock.herbicide) changed = true;
    state.stock.nutrient = n; state.stock.herbicide = h;
    state.stock.lastRefill = today;
    changed = true;
  }
  // 2) wither sweep — a natural death takes its whole living descendant line with it
  const t = Date.now();
  const dying = state.words.filter(w => !w.trashed && (t - new Date(w.vitalAt).getTime()) / DAY >= 7);
  if(dying.length){
    const kidsOf = new Map();
    state.words.forEach(w => {
      (w.parentIds || []).forEach(pid => {
        if(!kidsOf.has(pid)) kidsOf.set(pid, []);
        kidsOf.get(pid).push(w);
      });
    });
    const trashSet = new Set(dying.map(w => w.id));
    const queue = dying.slice();
    while(queue.length){
      const cur = queue.shift();
      (kidsOf.get(cur.id) || []).forEach(c => {
        if(!c.trashed && !trashSet.has(c.id)){ trashSet.add(c.id); queue.push(c); }
      });
    }
    const now = nowISO();
    dying.forEach(w => {
      w.trashed = true; w.trashedAt = now;
      addHistory('（自然）', '枯れた', w.name, '7日間、子が生まれなかった');
    });
    state.words.forEach(w => {
      if(trashSet.has(w.id) && !w.trashed){
        w.trashed = true; w.trashedAt = now;
        addHistory('（自然）', '一族枯れ', w.name, '上の言葉が枯れたので一緒に枯れた');
      }
    });
    changed = true;
  }
  return changed;
}
async function saveState(){
  // conflict check: re-GET and compare
  const fresh = await sbFetch();
  if(fresh !== baseContent){
    showBanner('誰かが更新したみたい。再読み込みしてね', true);
    throw new Error('conflict');
  }
  const body = JSON.stringify(state);
  const res = await fetch(SB_URL + '/rest/v1/wiki_pages?id=eq.' + ROW_ID, {
    method:'PATCH',
    headers:{
      'apikey':SB_KEY, 'Authorization':'Bearer ' + SB_KEY,
      'Content-Type':'application/json', 'Prefer':'return=minimal'
    },
    body: JSON.stringify({content: body})
  });
  if(!res.ok) throw new Error('保存に失敗したよ（' + res.status + '）');
  baseContent = body;
}
/* mutate -> save -> render, with rollback-ish error note */
async function commit(mutFn, okMsg){
  try{
    mutFn();
    await saveState();
    render();
    if(okMsg) showBanner(okMsg, false);
    return true;
  }catch(e){
    if(e.message !== 'conflict') showBanner(e.message || 'うまくいかなかったよ', true);
    try{ await loadState(); render(); }catch(_){}
    return false;
  }
}
/* ================= tree ================= */
function childrenMap(){
  const map = new Map();
  aliveWords().forEach(w => {
    (w.parentIds || []).forEach(pid => {
      if(!map.has(pid)) map.set(pid, []);
      map.get(pid).push(w);
    });
  });
  map.forEach((list, pid) => map.set(pid, applySiblingOrder(list, String(pid))));
  return map;
}
function applySiblingOrder(list, key){
  const ord = (state.siblingOrders && Array.isArray(state.siblingOrders[key])) ? state.siblingOrders[key] : null;
  const arr = list.slice();
  if(!ord) return arr.sort((a,b) => a.id - b.id);
  const idx = new Map(ord.map((id,i) => [id, i]));
  return arr.sort((a,b) => {
    const ia = idx.has(a.id) ? idx.get(a.id) : 1e9 + a.id;
    const ib = idx.has(b.id) ? idx.get(b.id) : 1e9 + b.id;
    return ia - ib;
  });
}
function primaryParentOf(w){
  const byId = new Map(state.words.map(x => [x.id, x]));
  const ps = (w.parentIds || []).map(id => byId.get(id)).filter(p => p && !p.trashed);
  if(!ps.length) return null;
  ps.sort((a,b) => (depthOf(b, byId) - depthOf(a, byId)) || (a.id - b.id));
  return ps[0];
}
function siblingGroupOf(w){
  const pp = primaryParentOf(w);
  const key = pp ? String(pp.id) : 'root';
  const group = aliveWords().filter(x => {
    const p = primaryParentOf(x);
    return pp ? (p && p.id === pp.id) : !p;
  });
  return {key: key, group: applySiblingOrder(group, key)};
}
function depthOf(w, byId, guard){
  guard = guard || 0;
  if(guard > 60) return 0;
  const parents = (w.parentIds || []).map(id => byId.get(id)).filter(p => p && !p.trashed);
  if(!parents.length) return 0;
  return 1 + Math.max.apply(null, parents.map(p => depthOf(p, byId, guard + 1)));
}
const NODE_W = 160, NODE_H = 38, COL_STEP = 200, ROW_STEP = 48, CANVAS_PAD = 18;
const SYRINGE_SVG = '<svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)">' +
  '<rect x="9.6" y="2.6" width="5.2" height="1.9" rx="0.9" fill="#4a7ca5"/>' +
  '<line x1="12.2" y1="4.5" x2="12.2" y2="7" stroke="#4a7ca5" stroke-width="1.6"/>' +
  '<line x1="8" y1="7" x2="16.4" y2="7" stroke="#4a7ca5" stroke-width="1.6" stroke-linecap="round"/>' +
  '<rect x="9.9" y="7" width="4.6" height="8.4" rx="1.6" fill="#dff1ff" stroke="#4a7ca5" stroke-width="1.1"/>' +
  '<rect x="10.6" y="11.6" width="3.2" height="3.1" rx="1" fill="#57b25e"/>' +
  '<line x1="12.2" y1="15.4" x2="12.2" y2="20.4" stroke="#8a8f96" stroke-width="1.3" stroke-linecap="round"/>' +
  '</g></svg>';
function nodeHTML(w, pos){
  const h = health(w);
  const merge = (w.parentIds || []).length >= 2 ? '<span class="bdg">🌳合流</span>' : '';
  const sel = w.id === selectedId ? ' sel' : '';
  const style = pos ? ' style="left:' + Math.round(pos.x) + 'px;top:' + Math.round(pos.y) + 'px"' : '';
  const syr = (w.lastNutrientAt && (Date.now() - new Date(w.lastNutrientAt).getTime()) < DAY)
    ? '<span class="syr">' + SYRINGE_SVG + '</span>' : '';
  return '<div class="node' + sel + '" data-open="' + w.id + '"' + style + '>' +
    '<span class="leaf" style="background:' + healthColor(h) + '"></span>' + syr +
    '<div class="n1">' +
    '<span class="nm">' + esc(w.name) + '</span>' + merge + '</div></div>';
}
function renderTree(){
  const box = $('#tree');
  const alive = aliveWords();
  if(!alive.length){
    box.innerHTML = '<div class="empty">まだ言葉がないよ。<br>「＋ 新しい言葉」から種をまこう 🌱</div>';
    return;
  }
  const byId = new Map(state.words.map(w => [w.id, w]));
  // primary parent = living parent with greatest depth (deepest); ties -> smallest id
  function primaryParent(w){
    const ps = (w.parentIds || []).map(id => byId.get(id)).filter(p => p && !p.trashed);
    if(!ps.length) return null;
    ps.sort((a,b) => (depthOf(b, byId) - depthOf(a, byId)) || (a.id - b.id));
    return ps[0];
  }
  const childOf = new Map();
  const roots = [];
  alive.forEach(w => {
    const pp = primaryParent(w);
    if(!pp){ roots.push(w); }
    else{
      if(!childOf.has(pp.id)) childOf.set(pp.id, []);
      childOf.get(pp.id).push(w);
    }
  });
  const orderedRoots = applySiblingOrder(roots, 'root');
  roots.length = 0; roots.push.apply(roots, orderedRoots);
  childOf.forEach((l, pid) => { const s = applySiblingOrder(l, String(pid)); l.length = 0; l.push.apply(l, s); });
  // layout: DFS from roots; leaves take row slots, parents center on their displayed children
  const pos = new Map();
  const placed = new Set();
  let nextRow = 0;
  function place(w, guard){
    if(placed.has(w.id) || guard > 200) return;
    placed.add(w.id);
    const cs = childOf.get(w.id) || [];
    cs.forEach(c => place(c, guard + 1));
    const ys = cs.filter(c => pos.has(c.id)).map(c => pos.get(c.id).rowU);
    const rowU = ys.length ? ys.reduce((a,b) => a + b, 0) / ys.length : nextRow++;
    pos.set(w.id, {depth: depthOf(w, byId), rowU: rowU});
  }
  roots.forEach(r => place(r, 0));
  // safety: anything not reached (cycles etc.) gets its own slot at its depth
  alive.forEach(w => { if(!pos.has(w.id)) pos.set(w.id, {depth: depthOf(w, byId), rowU: nextRow++}); });
  let maxDepth = 0, maxRow = 0;
  pos.forEach(p => { maxDepth = Math.max(maxDepth, p.depth); maxRow = Math.max(maxRow, p.rowU); });
  const cw = CANVAS_PAD * 2 + maxDepth * COL_STEP + NODE_W;
  const ch = CANVAS_PAD * 2 + maxRow * ROW_STEP + NODE_H;
  function xy(w){
    const p = pos.get(w.id);
    return {x: CANVAS_PAD + p.depth * COL_STEP, y: CANVAS_PAD + p.rowU * ROW_STEP};
  }
  // edges: every living parent -> child, as branch-like cubic beziers
  let paths = '';
  alive.forEach(w => {
    (w.parentIds || []).forEach(pid => {
      const p = byId.get(pid);
      if(!p || p.trashed || !pos.has(p.id)) return;
      const a = xy(p), b = xy(w);
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2;
      const x2 = b.x, y2 = b.y + NODE_H / 2;
      const dx = Math.max(28, Math.abs(x2 - x1) / 2);
      paths += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"/>';
    });
  });
  let html = '<div class="canvas" style="width:' + Math.round(cw) + 'px;height:' + Math.round(ch) + 'px">' +
    '<svg width="' + Math.round(cw) + '" height="' + Math.round(ch) + '">' + paths + '</svg>';
  alive.forEach(w => { html += nodeHTML(w, xy(w)); });
  html += '</div>';
  box.innerHTML = html;
}

function renderDetail(w){

async function detailAction(act, id){
  const w = wordById(id);
  if(!w) return;
  if(act === 'child'){ openWordForm({baseParentId: id}); return; }
  if(act === 'edit'){ openWordForm({editWord: w}); return; }
  if(act === 'del'){
    if(!confirm('🗑 「' + w.name + '」を削除する？\nすぐにゴミ箱に入るよ（この言葉だけ）。')) return;
    await commit(() => {
      const t = wordById(id);
      t.trashed = true; t.trashedAt = nowISO();
      addHistory(myName, '削除', t.name, '🗑 削除ボタンでゴミ箱へ（この言葉だけ）');
    }, '🗑 ' + w.name + ' をゴミ箱に入れたよ');
    selectedId = null; hideDetailPane();
    return;
  }
  if(act === 'up' || act === 'down'){
    const sib = siblingGroupOf(w);
    const i = sib.group.findIndex(x => x.id === id);
    const j = act === 'up' ? i - 1 : i + 1;
    if(i < 0 || j < 0 || j >= sib.group.length) return;
    const ids = sib.group.map(x => x.id);
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    await commit(() => {
      if(!state.siblingOrders) state.siblingOrders = {};
      state.siblingOrders[sib.key] = ids;
      addHistory(myName, '並び替え', w.name, act === 'up' ? '兄弟の中で上へ' : '兄弟の中で下へ');
    }, '↕️ 並びを変えたよ');
    return;
  }
  if(act === 'nutrient'){
    if(state.stock.nutrient <= 0) return;
    await commit(() => {
      const t = wordById(id);
      state.stock.nutrient -= 1;
      t.vitalAt = nowISO();
      t.lastNutrientAt = t.vitalAt;
      addHistory(myName, '栄養剤', t.name, '💊 元気を取り戻した（残り' + state.stock.nutrient + '）');
    }, '💊 ' + w.name + ' に栄養剤をあげたよ');
    return;
  }
  if(act === 'herbicide'){
    if(state.stock.herbicide <= 0) return;
    if(ageDays(w) >= 6){ showBanner('もうあと1日もないくらい枯れかけだよ。除草剤は使わなかったよ', true); return; }
    if(!confirm('☠️ 「' + w.name + '」に除草剤を注入する？\n一気に6日目まで進んで、あと約1日で枯れるよ。枯れると一族も一緒に枯れる。')) return;
    await commit(() => {
      const t = wordById(id);
      state.stock.herbicide -= 1;
      const target = Date.now() - 6 * DAY;
      if(new Date(t.vitalAt).getTime() > target) t.vitalAt = new Date(target).toISOString();
      addHistory(myName, '除草剤', t.name, '☠️ 除草剤で6日目まで進めた（残り' + state.stock.herbicide + '）');
    }, '☠️ ' + w.name + ' は一気に枯れかけたよ（あと約1日）');
    return;
  }
}

  openSheet(html);
  const form = $('#wform');
  const pSearch = $('#parentSearch');
  if(pSearch){

  form.addEventListener('submit', async (ev) => {

    const parentIds = Array.from(form.querySelectorAll('.pchk:checked')).map(c => Number(c.value));
    const fields = {
      name: name,

    let ok = false;

    }else{
      const nid = state.nextId;

        state.words.push({
          id: nid, name: fields.name, parentIds: fields.parentIds,

          if(p && !p.trashed) p.vitalAt = t;
        });
        const parentNames = fields.parentIds.map(pid => { const p = wordById(pid); return p ? p.name : ''; }).filter(Boolean).join('・');
        addHistory(myName, baseParentId ? '子を登録' : '種まき', fields.name,
          parentNames ? '親：' + parentNames : '根っことして登録');
      }, '🌱 「' + name + '」を登録したよ');
    }
    if(ok){
      closeSheet();
      if(baseParentId && !editing) openWord(baseParentId);
      else if(editing) openWord(editing.id);
    }
  });
}

/* ================= trash / history ================= */
function openTrash(){
  const list = state.words.filter(w => w.trashed)
    .sort((a,b) => String(b.trashedAt || '').localeCompare(String(a.trashedAt || '')));
  const rows = list.length ? list.map(w =>
    '<div class="lrow"><div class="t">🍂 ' + esc(w.name) + '</div>' +
    '<div class="s">枯れた日：' + fmtDT(w.trashedAt) + (w.family ? ' ・ 系：' + esc(w.family) : '') + '</div>' +
    '<button class="hbtn restore" type="button" data-restore="' + w.id + '">♻️ 戻す</button></div>'
  ).join('') : '<div class="empty">ゴミ箱はからっぽだよ 🍃</div>';
  showSub('<div class="viewhead"><button class="back" type="button" id="subBack">← 木にもどる</button><h3>🗑 ゴミ箱（' + list.length + '）</h3></div>' + rows);
  $('#subBack').addEventListener('click', showMain);
  $('#subView').querySelectorAll('[data-restore]').forEach(el => {
    el.addEventListener('click', async () => {
      const id = Number(el.dataset.restore);
      const w = wordById(id);
      const ok = await commit(() => {
        const t = wordById(id);
        t.trashed = false; t.trashedAt = null; t.vitalAt = nowISO();
        addHistory(myName, '戻した', t.name, 'ゴミ箱から庭に戻した');
      }, '♻️ 「' + (w ? w.name : '') + '」を庭に戻したよ');
      if(ok) openTrash();
    });
  });
}
function openHistory(){
  const list = state.history.slice(-100).reverse();
  const rows = list.length ? list.map(hx =>
    '<div class="lrow"><div class="t">' + esc(hx.action) + '：' + esc(hx.word) + '</div>' +
    '<div class="s">' + fmtDT(hx.at) + ' ・ ' + esc(hx.by) + (hx.detail ? ' ・ ' + esc(hx.detail) : '') + '</div></div>'
  ).join('') : '<div class="empty">まだ履歴がないよ</div>';
  showSub('<div class="viewhead"><button class="back" type="button" id="subBack">← 木にもどる</button><h3>📜 変更履歴</h3></div>' + rows);
  $('#subBack').addEventListener('click', showMain);
}
function openSearch(){
  showSub('<div class="viewhead"><button class="back" type="button" id="subBack">← 木にもどる</button><h3>🔍 全体検索</h3></div>' +
    '<div style="padding:10px 12px 0"><input type="text" id="searchInput" placeholder="言葉・メモ・系で検索" autocomplete="off" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:15px"></div>' +
    '<div id="searchResults"></div>');
  $('#subBack').addEventListener('click', showMain);
  const input = $('#searchInput');
  const box = $('#searchResults');
  function draw(){
    const q = input.value.trim().toLowerCase();
    const hits = state.words.filter(w => {
      if(!q) return true;
      return [w.name, w.memo, w.family, w.author].some(s => String(s || '').toLowerCase().includes(q));
    }).sort((a,b) => ((a.trashed ? 1 : 0) - (b.trashed ? 1 : 0)) || (a.id - b.id));
    box.innerHTML = '<div style="padding:8px 14px 2px;font-size:12.5px;color:var(--sub)">' + hits.length + '件</div>' +
      (hits.length ? hits.map(w => {
        const sub = [w.family ? '系：' + esc(w.family) : '', w.bornOn || ''].filter(Boolean).join(' ・ ');
        return w.trashed
          ? '<div class="lrow"><div class="t">🍂 ' + esc(w.name) + '（ゴミ箱）</div><div class="s">' + sub + '</div><button class="hbtn restore" type="button" data-trash="1">🗑 ゴミ箱を見る</button></div>'
          : '<div class="lrow"><div class="t">' + esc(w.name) + '</div><div class="s">' + sub + '</div><button class="hbtn restore" type="button" data-openword="' + w.id + '">🌳 木で見る</button></div>';
      }).join('') : '<div class="empty">見つからないよ</div>');
    box.querySelectorAll('[data-openword]').forEach(el => {
      el.addEventListener('click', () => { showMain(); openWord(Number(el.dataset.openword)); });
    });
    box.querySelectorAll('[data-trash]').forEach(el => {
      el.addEventListener('click', openTrash);
    });
  }
  input.addEventListener('input', draw);
  draw();
  input.focus();
}

/* ================= gate & boot ================= */
function enterApp(){
  $('#gate').style.display = 'none';
  $('#app').style.display = '';
  if(!booted){ booted = true; bootData(); }
}
async function bootData(){
  try{
    await loadState();
    const changed = autoProcess();
    render();
    if(changed){
      try{ await saveState(); }
      catch(e){ if(e.message !== 'conflict') showBanner('自動処理の保存に失敗したよ', true); }
    }
  }catch(e){
    showBanner(e.message || '読み込めなかったよ', true);
  }
}
function initGate(){
  $('#buildStr').textContent = BUILD;
  if(localStorage.getItem('keifuzu_ok_2501') === '1' && myName){
    enterApp();
    return;
  }
  $('#gate').style.display = 'flex';
  $('#gateName').value = myName || '';
  const tryEnter = () => {
    const name = $('#gateName').value.trim();
    const pass = $('#gatePass').value.trim();
    if(!name){ $('#gateErr').textContent = '名前を入れてね'; return; }
    if(pass !== PASS){ $('#gateErr').textContent = 'パスワードが違うみたい'; return; }
    myName = name;
    localStorage.setItem('keifuzu_name', name);
    localStorage.setItem('keifuzu_ok_2501', '1');
    enterApp();
  };
  $('#gateBtn').addEventListener('click', tryEnter);
  $('#gatePass').addEventListener('keydown', e => { if(e.key === 'Enter') tryEnter(); });
  $('#gateName').addEventListener('keydown', e => { if(e.key === 'Enter') $('#gatePass').focus(); });
}
document.addEventListener('DOMContentLoaded', () => {
  initGate();
  $('#btnNew').addEventListener('click', () => { showMain(); openWordForm({}); });
  $('#btnTrash').addEventListener('click', openTrash);
  $('#btnHistory').addEventListener('click', openHistory);
  $('#btnSearch').addEventListener('click', openSearch);
  $('#btnReload').addEventListener('click', async () => {
    const rb = $('#btnReload'); rb.classList.add('spin');
    selectedId = null; hideDetailPane(); showMain();
    try{
      await loadState();
      const changed = autoProcess();
      render();
      if(changed){ try{ await saveState(); }catch(e){} }
      showBanner('再読み込みしたよ 🌿', false);
    }catch(e){ showBanner(e.message || '読み込めなかったよ', true); }
    finally{ rb.classList.remove('spin'); }
  });
  $('#scrim').addEventListener('click', () => { selectedId = null; closeSheet(); renderTreeSel(); });
  document.addEventListener('click', (e) => {
    const n = e.target.closest('[data-open]');
    if(n && n.classList.contains('node')) openWord(Number(n.dataset.open));
  });
});
</script>
